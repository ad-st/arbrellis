name: Release Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build.txt
      - run: python -m pip install -r requirements/build.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build:server
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: arbrellis-linux-x64
          compression-level: 0
          retention-days: 7
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.tar.gz
            apps/desktop/dist/SHA256SUMS

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: arbrellis-linux-x64
          path: artifacts
      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Extract portable package
        run: |
          mkdir extracted
          tar -xzf artifacts/arbrellis-*-linux-x64.tar.gz -C extracted
      - name: Test frozen backend
        run: |
          backend="$(find extracted -type f -path '*/resources/server/arbrellis-server' -print -quit)"
          test -n "$backend"
          python tests/smoke/backend.py "$backend"
      - name: Install Debian package and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ./artifacts/*.deb xvfb xauth
      - name: Test installed desktop
        run: |
          desktop="$(command -v arbrellis || true)"
          if [ -z "$desktop" ]; then
            desktop="$(find /opt -type f -name arbrellis -perm -111 -print -quit)"
          fi
          test -n "$desktop"
          xvfb-run --auto-servernum python tests/smoke/desktop.py "$desktop"
      - name: Remove Debian package
        if: always()
        run: sudo apt-get remove -y arbrellis || true

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: arbrellis-linux-x64
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
