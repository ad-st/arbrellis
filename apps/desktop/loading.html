<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starting Arbrellis</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071f19; color: #d7f8eb; }
      main { display: grid; justify-items: center; gap: 18px; }
      .pulse { width: 32px; height: 32px; border-radius: 999px; background: #69e2b5; box-shadow: 0 0 28px #69e2b5aa; animation: pulse 1.1s ease-in-out infinite alternate; }
      p { margin: 0; color: #9bcbb9; font-size: 14px; letter-spacing: .02em; }
      @keyframes pulse { to { transform: scale(.65); opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </head>
  <body>
    <main><div class="pulse" aria-hidden="true"></div><p>Starting local knowledge service…</p></main>
  </body>
</html>
