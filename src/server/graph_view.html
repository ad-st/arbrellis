    async function refreshGraphFromServer({ preserveConceptFactIds = [], preserveConceptReturnTransform = null } = {}) {
      const response = await fetch('/api/graph');
      if (!response.ok) throw new Error(`Could not refresh graph: HTTP ${response.status}`);
      const next = await response.json();
      closeFocusedConcept({ restoreView: false });
      placeUpdatedGraph(next);
      graph = next;
      selectedId = null;
      render();
      renderAccumulatedGrowth();
      if (documentGraphFocus && selectedDocument) applyDocumentGraphFocus(selectedDocument, { fit: false });
      else if (documentGraphFocus && selectedChat) applyDocumentGraphFocus(selectedChat, { fit: false, sourceKey: `chat:${selectedChat.id}` });
      if (preserveConceptFactIds.length) {
        const preservedIds = new Set(preserveConceptFactIds.map(Number));
        const preservedNode = graph.nodes
          .map(node => ({
            node,
            matches: node.facts.filter(fact => preservedIds.has(Number(fact.id))).length,
          }))
          .filter(item => item.matches > 0)
          .sort((a, b) => b.matches - a.matches)[0]?.node;
        if (preservedNode) {
          focusedNodeId = preservedNode.id;
          focusReturnTransform = preserveConceptReturnTransform;
          await loadConceptDetails(preservedNode);
          renderConceptView(preservedNode);
          conceptView.style.setProperty('--origin-x', `${width / 2}px`);
          conceptView.style.setProperty('--origin-y', `${height / 2}px`);
          conceptView.hidden = false;
          conceptView.setAttribute('aria-hidden', 'false');
          selectNode(preservedNode);
        }
      }
      if (graph.nodes.length) persistPositions(graph.nodes);
    }

    function updateHistoryControls(history) {
      undoButton.disabled = !history?.can_undo;
      redoButton.disabled = !history?.can_redo;
      undoButton.title = history?.undo
        ? `Undo ${history.undo.action}: ${history.undo.label} (Ctrl+Z)`
        : 'Nothing to undo';
      redoButton.title = history?.redo
        ? `Redo ${history.redo.action}: ${history.redo.label} (Ctrl+Shift+Z)`
        : 'Nothing to redo';
    }

    async function loadHistoryStatus() {
      try {
        const response = await fetch('/api/graph/history');
        const history = await response.json();
        if (!response.ok) throw new Error(history.error || `HTTP ${response.status}`);
        updateHistoryControls(history);
      } catch (error) {
        updateHistoryControls(null);
        console.warn('Could not load graph history:', error);
      }
    }

    async function moveGraphHistory(direction) {
      undoButton.disabled = true;
      redoButton.disabled = true;
      try {
        const response = await fetch(`/api/graph/history/${direction}`, { method: 'POST' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        if (result.changed) {
          cancelGrowthAnimation();
          factDetails.delete(Number(result.citation_id));
          await refreshGraphFromServer();
          await loadFacts();
        }
        updateHistoryControls(result.history);
      } catch (error) {
        console.warn(`Could not ${direction} graph history:`, error);
        await loadHistoryStatus();
      }
    }

    async function saveFactDraft(fact, value, status = null, dirtyBadge = null) {
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      try {
        const response = await fetch(`/api/citations/${fact.id}/draft`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ highlight: value }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        fact.draft_highlight = payload.draft_highlight;
        fact.draft_updated_at = payload.dirty ? new Date().toISOString() : null;
        if (dirtyBadge) dirtyBadge.hidden = !payload.dirty;
        if (status) status.textContent = payload.dirty ? 'Draft saved · not integrated' : 'Draft cleared · already integrated';
        return payload;
      } catch (error) {
        if (status) status.textContent = `Draft not saved: ${error.message}`;
        throw error;
      }
    }

    async function updateFact(fact, editor, status, controls, rediscoverLabel = false) {
      const highlight = editor.value.trim();
      if (!highlight) { status.textContent = 'Fact text cannot be empty.'; return; }
      if (!rediscoverLabel && highlight === fact.highlight && !factIsDirty(fact) && factIsIntegrated(fact) && factIsAnalyzed(fact)) {
        status.textContent = 'Nothing to integrate.';
        return;
      }
      controls.forEach(control => { control.disabled = true; });
      try {
        status.textContent = 'Saving draft…';
        await saveFactDraft(fact, highlight, status);
        const discoverLabel = rediscoverLabel || !String(fact.label || '').trim();
        status.textContent = discoverLabel ? 'Discovering label and integrating…' : 'Refreshing embedding…';
        setIntegrationJobs(highlight, discoverLabel);
        const response = await fetch(`/api/citations/${fact.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ highlight, rediscover_label: rediscoverLabel }),
        });
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
        pollIntegration(
          job.id,
          async () => {
            await loadFact(fact.id, true);
            selectedFactId = Number(fact.id);
            renderFactsDrawer();
          },
          message => {
            controls.forEach(control => { control.disabled = false; });
            status.textContent = message;
          },
        );
      } catch (error) {
        failIntegration(error.message);
        controls.forEach(control => { control.disabled = false; });
        status.textContent = error.message;
      }
    }

    async function setFactIntegrated(fact, status, controls) {
      controls.forEach(control => { control.disabled = true; });
      status.textContent = 'Integrating stored analysis…';
      try {
        const response = await fetch(`/api/citations/${fact.id}/integration`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ integrated: true }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        if (result.changed) await applyIntegrationResult({ citation: { id: fact.id } });
        await loadFact(fact.id, true);
        await loadFacts();
        updateHistoryControls(result.history);
      } catch (error) {
        controls.forEach(control => { control.disabled = false; });
        status.textContent = error.message;
      }
    }

    async function deleteFact(fact, status, controls) {
      if (!confirm(`Delete fact #${fact.id}? This cannot be undone.`)) return;
      controls.forEach(control => { control.disabled = true; });
      status.textContent = 'Deleting…';
      try {
        const response = await fetch(`/api/citations/${fact.id}`, { method: 'DELETE' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        factDetails.delete(Number(fact.id));
        selectedFactId = null;
        factEditorOrigin = null;
        await refreshGraphFromServer();
        await loadFacts();
        await loadDocuments();
        await loadHistoryStatus();
      } catch (error) {
        controls.forEach(control => { control.disabled = false; });
        status.textContent = error.message;
      }
    }

    function graphDifference(previous, next, integration) {
      const previousNodes = new Map(previous.nodes.map(node => [node.id, node]));
      const previousFactIds = new Set(previous.nodes.flatMap(node => node.facts.map(fact => fact.id)));
      const previousEdges = new Set(previous.edges.map(edgeKey));
      const nextEdges = new Set(next.edges.map(edgeKey));
      const citationId = Number(integration?.citation?.id);
      const target = next.nodes.find(node => node.facts.some(fact => fact.id === citationId));
      return {
        targetId: target?.id ?? null,
        addedNodeIds: new Set(next.nodes.filter(node => !previousNodes.has(node.id)).map(node => node.id)),
        addedFactIds: new Set(next.nodes.flatMap(node => node.facts).filter(fact => !previousFactIds.has(fact.id)).map(fact => fact.id)),
        addedEdgeKeys: new Set([...nextEdges].filter(key => !previousEdges.has(key))),
        removedEdgeKeys: new Set([...previousEdges].filter(key => !nextEdges.has(key))),
      };
    }

    function placeUpdatedGraph(next) {
      const oldPositions = new Map(graph.nodes.map(node => [node.id, { x: node.x, y: node.y }]));
      const placements = new Map();
      const occupied = [];
      const savePlacement = (node, point) => {
        placements.set(node.id, point);
        occupied.push({ ...point, radius: collapsedNodeRadius(node) });
        node.position = {
          x: Math.max(.03, Math.min(.97, point.x / width)),
          y: Math.max(.03, Math.min(.97, point.y / height)),
        };
      };
      next.nodes.forEach(node => {
        const old = oldPositions.get(node.id);
        const saved = Number.isFinite(node.position?.x) && Number.isFinite(node.position?.y)
          ? { x: node.position.x * width, y: node.position.y * height }
          : null;
        if (old || saved) savePlacement(node, old || saved);
      });
      for (const node of next.nodes.filter(item => !placements.has(item.id))) {
        const related = next.edges
          .filter(edge => edge.source === node.id || edge.target === node.id)
          .map(edge => placements.get(edge.source === node.id ? edge.target : edge.source))
          .filter(Boolean);
        const seed = related.length ? {
          x: related.reduce((sum, item) => sum + item.x, 0) / related.length,
          y: related.reduce((sum, item) => sum + item.y, 0) / related.length,
        } : { x: width / 2, y: height / 2 };
        const nodeRadius = collapsedNodeRadius(node);
        const baseAngle = Number(node.id) * 2.39996;
        let point = null;
        for (let ring = 0; ring < 18 && !point; ring++) {
          const distance = ring === 0 ? 0 : 64 + ring * 28;
          const samples = ring === 0 ? 1 : 20;
          for (let sample = 0; sample < samples; sample++) {
            const angle = baseAngle + sample * Math.PI * 2 / samples;
            const candidate = {
              x: Math.max(nodeRadius + 30, Math.min(width - nodeRadius - 30, seed.x + Math.cos(angle) * distance)),
              y: Math.max(nodeRadius + 30, Math.min(height - nodeRadius - 30, seed.y + Math.sin(angle) * distance)),
            };
            const clear = occupied.every(other => Math.hypot(candidate.x - other.x, candidate.y - other.y) >= nodeRadius + other.radius + 34);
            if (clear) { point = candidate; break; }
          }
        }
        savePlacement(node, point || { x: width / 2, y: height / 2 });
      }
    }

    function cancelGrowthAnimation() {
      accumulatedGrowth.targetIds.clear();
      accumulatedGrowth.addedEdgeKeys.clear();
      accumulatedGrowth.removedEdges.clear();
      document.querySelectorAll('.knowledge-halo').forEach(halo => halo.remove());
      document.querySelectorAll('.knowledge-active').forEach(node => node.classList.remove('knowledge-active'));
      document.querySelectorAll('.edge-new').forEach(edge => edge.classList.remove('edge-new'));
      document.querySelectorAll('.edge-removed-wrap').forEach(edge => edge.remove());
      document.querySelectorAll('.node-new-pending').forEach(node => {
        node.classList.remove('node-new-pending');
        node.classList.add('node-new');
      });
      document.querySelectorAll('.edge[data-growth-pending]').forEach(edge => {
        edge.style.opacity = '';
        edge.removeAttribute('data-growth-pending');
      });
    }

    function addKnowledgeHalo(target) {
      const radius = nodeRadius(target) + 7;
      const halo = el('g', { class: 'knowledge-halo' });
      halo.append(el('circle', { r: radius }), el('circle', { r: radius }));
      target.element.insertBefore(halo, target.circle);
    }

    function revealNewEdges(diff) {
      for (const key of diff.addedEdgeKeys) {
        const edge = edgeLayer.querySelector(`[data-edge-key="${key}"]`);
        if (!edge) continue;
        edge.style.opacity = '';
        edge.removeAttribute('data-growth-pending');
        edge.classList.add('edge-new');
      }
    }

    function addRemovedEdgeGhosts(removedEdges) {
      for (const removed of removedEdges) {
        const x1 = Number(removed.x1), y1 = Number(removed.y1);
        const x2 = Number(removed.x2), y2 = Number(removed.y2);
        const length = Math.hypot(x2 - x1, y2 - y1);
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        const wrapper = el('g', {
          class: 'edge-removed-wrap',
          transform: `translate(${(x1 + x2) / 2} ${(y1 + y2) / 2}) rotate(${angle})`,
        });
        const shrinkingLine = el('g', { class: 'edge edge-removed' });
        const line = el('line', {
          x1: -length / 2,
          y1: 0,
          x2: length / 2,
          y2: 0,
          'stroke-width': removed.strokeWidth,
          opacity: removed.opacity,
        });
        const title = el('title'); title.textContent = `Removed relationship: ${removed.label}`;
        line.append(title); shrinkingLine.append(line); wrapper.append(shrinkingLine);
        edgeLayer.append(wrapper);
      }
    }

    function renderAccumulatedGrowth() {
      document.querySelectorAll('.knowledge-halo').forEach(halo => halo.remove());
      document.querySelectorAll('.edge-removed-wrap').forEach(edge => edge.remove());
      revealNewEdges({ addedEdgeKeys: accumulatedGrowth.addedEdgeKeys });
      for (const targetId of accumulatedGrowth.targetIds) {
        const target = nodeById.get(targetId);
        if (!target) continue;
        target.element.classList.remove('node-new-pending');
        target.element.classList.add('knowledge-active');
        addKnowledgeHalo(target);
      }
      addRemovedEdgeGhosts([...accumulatedGrowth.removedEdges.values()]);
    }

    function animateKnowledgeGrowth(diff, removedEdges) {
      for (const nodeId of diff.addedNodeIds) {
        const node = nodeById.get(nodeId);
        if (node) {
          node.element.classList.remove('node-new-pending');
          node.element.classList.add('node-new');
        }
      }
      if (diff.targetId !== null) accumulatedGrowth.targetIds.add(diff.targetId);
      for (const key of diff.addedEdgeKeys) {
        accumulatedGrowth.removedEdges.delete(key);
        accumulatedGrowth.addedEdgeKeys.add(key);
      }
      for (const removed of removedEdges) {
        if (accumulatedGrowth.addedEdgeKeys.delete(removed.key)) continue;
        accumulatedGrowth.removedEdges.set(removed.key, removed);
      }
      renderAccumulatedGrowth();
    }

    async function applyIntegrationResult(integration) {
      const response = await fetch('/api/graph');
      if (!response.ok) throw new Error(`Could not refresh graph: HTTP ${response.status}`);
      const next = await response.json();
      const diff = graphDifference(graph, next, integration);
      closeFocusedConcept({ restoreView: false });
      const removedEdges = [...diff.removedEdgeKeys].map(key => {
        const edge = edgeLayer.querySelector(`[data-edge-key="${key}"]`);
        if (!edge) return null;
        const source = nodeById.get(Number(edge.dataset.source));
        const target = nodeById.get(Number(edge.dataset.target));
        return {
          key,
          x1: edge.getAttribute('x1'), y1: edge.getAttribute('y1'),
          x2: edge.getAttribute('x2'), y2: edge.getAttribute('y2'),
          strokeWidth: edge.getAttribute('stroke-width'),
          opacity: edge.getAttribute('opacity'),
          label: `${source?.label || edge.dataset.source} ↔ ${target?.label || edge.dataset.target}`,
        };
      }).filter(Boolean);

      placeUpdatedGraph(next);
      graph = next;
      selectedId = null;
      render();
      if (documentGraphFocus && selectedDocument) applyDocumentGraphFocus(selectedDocument, { fit: false });
      for (const nodeId of diff.addedNodeIds) nodeById.get(nodeId)?.element.classList.add('node-new-pending');
      for (const key of diff.addedEdgeKeys) {
        const edge = edgeLayer.querySelector(`[data-edge-key="${key}"]`);
        if (!edge) continue;
        edge.style.opacity = '0';
        edge.setAttribute('data-growth-pending', 'true');
      }
      persistPositions(graph.nodes);
      clearIntegrationJobs();
      animateKnowledgeGrowth(diff, removedEdges);
    }

    function closeFactDialog() {
      if (factDialog.open) factDialog.close();
      factStatus.textContent = '';
    }

    function integrateFact(event) {
      event.preventDefault();
      const text = factText.value.trim();
      if (!text) { factText.focus(); return; }
      setIntegrationJobs(text);
      factText.value = '';
      closeFactDialog();
      startIntegration(text);
    }

    function drawEdge(edge) {
      const a = nodeById.get(edge.source), b = nodeById.get(edge.target);
      const dx = b.x - a.x, dy = b.y - a.y, distance = Math.hypot(dx, dy) || 1;
      const ux = dx / distance, uy = dy / distance;
      const startRadius = Math.min(nodeRadius(a) + 2, distance / 2);
      const endRadius = Math.min(nodeRadius(b) + 2, distance / 2);
      Object.entries({
        x1: a.x + ux * startRadius,
        y1: a.y + uy * startRadius,
        x2: b.x - ux * endRadius,
        y2: b.y - uy * endRadius,
      }).forEach(([key, value]) => edge.element.setAttribute(key, value));
    }

    function drawNode(node) {
      node.element.setAttribute('transform', `translate(${node.x} ${node.y})`);
      graph.edges.forEach(edge => {
        if (edge.source === node.id || edge.target === node.id) drawEdge(edge);
      });
    }

    function truncateCaption(value, limit = 88) {
      const compact = String(value || 'Preparing caption…').replace(/\s+/g, ' ').trim();
      if (compact.length <= limit) return compact;
      const candidate = compact.slice(0, limit - 1);
      const boundary = candidate.lastIndexOf(' ');
      return `${candidate.slice(0, boundary > limit * .58 ? boundary : candidate.length).trimEnd()}…`;
    }

    function factCoordinates(node) {
      const count = node.facts.length;
      const { columns, rows } = factGridDimensions(count);
      return node.facts.map((fact, index) => {
        const row = Math.floor(index / columns);
        const firstInRow = row * columns;
        const itemsInRow = Math.min(columns, count - firstInRow);
        const column = index - firstInRow;
        return {
          id: fact.id,
          x: (column - (itemsInRow - 1) / 2) * (FACT_CARD_WIDTH + FACT_CARD_GAP),
          y: (row - (rows - 1) / 2) * (FACT_CARD_HEIGHT + FACT_CARD_GAP),
        };
      });
    }

    function buildFactLayer(node) {
      const layer = el('g', { class: 'fact-layer' });
      if (!node.detailsLoaded) {
        layer.setAttribute('display', 'none');
        return layer;
      }
      const coordinates = factCoordinates(node);
      const byId = new Map(coordinates.map(point => [point.id, point]));
      node.fact_edges.forEach(edge => {
        const a = byId.get(edge.source), b = byId.get(edge.target);
        if (!a || !b) return;
        const line = el('line', { class: 'fact-edge', x1: a.x, y1: a.y, x2: b.x, y2: b.y, pathLength: 1 });
        line.dataset.edgeKey = edgeKey(edge);
        const title = el('title'); title.textContent = `Fact similarity: ${edge.similarity}`;
        line.append(title); layer.append(line);
      });
      node.facts.forEach((fact, index) => {
        const point = coordinates[index];
        const group = el('g', { class: 'fact-node', transform: `translate(${point.x} ${point.y})` });
        group.dataset.factId = fact.id;
        group.append(el('rect', {
          x: -FACT_CARD_WIDTH / 2,
          y: -FACT_CAPTION_HEIGHT / 2,
          width: FACT_CARD_WIDTH,
          height: FACT_CAPTION_HEIGHT,
          rx: 6,
        }));
        const captionBox = el('foreignObject', {
          class: 'fact-caption-box',
          x: -FACT_CARD_WIDTH / 2,
          y: -FACT_CAPTION_HEIGHT / 2,
          width: FACT_CARD_WIDTH,
          height: FACT_CAPTION_HEIGHT,
        });
        const caption = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
        caption.className = 'fact-caption';
        caption.textContent = truncateCaption(fact.caption || fact.highlight);
        captionBox.append(caption);
        const title = el('title');
        title.textContent = `${fact.caption || 'Caption pending'}\n\n${fact.highlight}`;
        group.append(captionBox, title); layer.append(group);
      });
      layer.setAttribute('display', node.expanded ? 'inline' : 'none');
      return layer;
    }

    const renderConceptTransform = () => {
      conceptTransformRenderFrame = null;
      conceptViewport.style.transform = `translate(${conceptTransform.x}px, ${conceptTransform.y}px) scale(${conceptTransform.k})`;
      if (hoveredDocumentFactId !== null) scheduleDocumentLinks();
    };
    const applyConceptTransform = () => {
      if (conceptTransformRenderFrame === null) conceptTransformRenderFrame = requestAnimationFrame(renderConceptTransform);
    };

    function conceptFactPositions(facts) {
      const { columns, rows } = factGridDimensions(facts.length);
      const stepX = CONCEPT_FACT_WIDTH + 72;
      const stepY = CONCEPT_FACT_HEIGHT + 72;
      return facts.map((fact, index) => {
        const row = Math.floor(index / columns);
        const firstInRow = row * columns;
        const itemsInRow = Math.min(columns, facts.length - firstInRow);
        const column = index - firstInRow;
        const fallbackX = width / 2 + (column - (itemsInRow - 1) / 2) * stepX;
        const fallbackY = height / 2 + (row - (rows - 1) / 2) * stepY;
        return {
          id: fact.id,
          x: fact.position ? Number(fact.position.x) * width : fallbackX,
          y: fact.position ? Number(fact.position.y) * height : fallbackY,
        };
      });
    }

    function conceptPoint(event) {
      const point = conceptGraph.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const matrix = conceptViewport.getScreenCTM();
      return matrix ? point.matrixTransform(matrix.inverse()) : { x: event.clientX, y: event.clientY };
    }

    function persistFactPosition(fact, point) {
      fact.position = { x: point.x / width, y: point.y / height };
      fetch('/api/graph/fact-positions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ positions: [{ id: fact.id, ...fact.position }] }),
      }).then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      }).catch(error => console.warn('Could not save fact position:', error));
    }

    function factBoxConnection(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const extent = Math.max(Math.abs(dx) / (CONCEPT_FACT_WIDTH / 2), Math.abs(dy) / (CONCEPT_FACT_HEIGHT / 2)) || 1;
      const ratio = 1 / extent;
      return {
        x1: a.x + dx * ratio,
        y1: a.y + dy * ratio,
        x2: b.x - dx * ratio,
        y2: b.y - dy * ratio,
      };
    }

    async function loadConceptDetails(node) {
      if (node.detailsLoaded) return node;
      if (!node.detailsPromise) {
        node.detailsPromise = fetch(`/api/concepts/${node.id}/facts`)
          .then(async response => {
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            node.facts = payload.facts || [];
            node.fact_edges = payload.fact_edges || [];
            node.fact_count = node.facts.length;
            node.detailsLoaded = true;
            return node;
          })
          .finally(() => { node.detailsPromise = null; });
      }
      return node.detailsPromise;
    }

    function renderConceptView(node, resetTransform = true) {
      conceptGraph.setAttribute('viewBox', `0 0 ${width} ${height}`);
      conceptEdgeLayer.replaceChildren();
      conceptNodeLayer.replaceChildren();
      const positions = conceptFactPositions(node.facts);
      const byId = new Map(positions.map(point => [point.id, point]));
      const edgeElements = new Map();
      node.fact_edges.forEach(edge => {
        const a = byId.get(edge.source), b = byId.get(edge.target);
        if (!a || !b) return;
        const points = factBoxConnection(a, b);
        const line = el('line', { class: 'concept-fact-edge', ...points });
        edgeElements.set(edgeKey(edge), line);
        const title = el('title'); title.textContent = `Fact similarity: ${edge.similarity}`;
        line.append(title); conceptEdgeLayer.append(line);
      });
      const updateConceptEdges = () => node.fact_edges.forEach(edge => {
        const a = byId.get(edge.source), b = byId.get(edge.target);
        const line = edgeElements.get(edgeKey(edge));
        if (!a || !b || !line) return;
        const points = factBoxConnection(a, b);
        Object.entries(points).forEach(([name, value]) => line.setAttribute(name, value));
      });
      node.facts.forEach((fact, index) => {
        const point = positions[index];
        const group = el('g', { class: 'concept-fact-node', transform: `translate(${point.x} ${point.y})` });
        group.dataset.factId = fact.id;
        group.append(el('rect', {
          x: -CONCEPT_FACT_WIDTH / 2,
          y: -CONCEPT_FACT_HEIGHT / 2,
          width: CONCEPT_FACT_WIDTH,
          height: CONCEPT_FACT_HEIGHT,
          rx: 12,
        }));
        const captionBox = el('foreignObject', {
          x: -CONCEPT_FACT_WIDTH / 2,
          y: -CONCEPT_FACT_HEIGHT / 2,
          width: CONCEPT_FACT_WIDTH,
          height: CONCEPT_FACT_HEIGHT,
        });
        const caption = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
        caption.className = 'concept-fact-caption';
        caption.textContent = truncateCaption(fact.caption || fact.highlight, 112);
        captionBox.append(caption);
        const title = el('title');
        title.textContent = `${fact.caption || 'Caption pending'}\n\n${fact.highlight}`;
        group.append(captionBox, title);
        let suppressClick = false;
        group.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          const start = { x: event.clientX, y: event.clientY };
          const origin = { x: point.x, y: point.y };
          let dragged = false;
          group.setPointerCapture(event.pointerId);
          const move = moveEvent => {
            if (!dragged && Math.hypot(moveEvent.clientX - start.x, moveEvent.clientY - start.y) <= 5) return;
            dragged = true;
            suppressClick = true;
            clearTimeout(factOpenTimer);
            const current = conceptPoint(moveEvent);
            const initial = conceptPoint({ clientX: start.x, clientY: start.y });
            point.x = origin.x + current.x - initial.x;
            point.y = origin.y + current.y - initial.y;
            group.setAttribute('transform', `translate(${point.x} ${point.y})`);
            updateConceptEdges();
            scheduleDocumentLinks();
          };
          const finish = finishEvent => {
            if (group.hasPointerCapture(finishEvent.pointerId)) group.releasePointerCapture(finishEvent.pointerId);
            group.removeEventListener('pointermove', move);
            group.removeEventListener('pointerup', finish);
            group.removeEventListener('pointercancel', finish);
            if (dragged) persistFactPosition(fact, point);
          };
          group.addEventListener('pointermove', move);
          group.addEventListener('pointerup', finish);
          group.addEventListener('pointercancel', finish);
        });
        group.addEventListener('click', event => {
          event.stopPropagation();
          if (suppressClick) { suppressClick = false; return; }
          clearTimeout(factOpenTimer);
          if (event.detail > 1) return;
          factOpenTimer = setTimeout(() => openFactEditor(fact.id, 'concept'), 230);
        });
        group.addEventListener('pointerenter', event => {
          hoveredConceptFact = fact;

        group.addEventListener('pointerleave', () => {

          event.preventDefault();

      applyConceptTransform();
    }

    async function enterConceptView(node) {

    function buildFactBadge(node) {

    function refreshNodeGeometry(node) {

    function closeFocusedConcept({ restoreView = true } = {}) {
      if (focusedNodeId === null) { exitConceptView(); return false; }

    function openFocusedConcept(node) {

        return;

      if (focusedNodeId === node.id) return;
      const returnTransform = focusReturnTransform ? { ...focusReturnTransform } : { ...transform };
      if (focusedNodeId !== null) closeFocusedConcept({ restoreView: false });
      focusReturnTransform = returnTransform;
      focusedNodeId = node.id;

      node.element.classList.add('concept-opening');

      selectNode(node);
      const targetScale = Math.max(2.8, Math.min(3.6, transform.k * 2.1));
      animateTransform({
        k: targetScale,

      });
      clearTimeout(conceptOpenTimer);

    function drawLayout() {
      graph.nodes.forEach(node => node.element.setAttribute('transform', `translate(${node.x} ${node.y})`));
      graph.edges.forEach(drawEdge);
    }

    function persistPositions(nodes) {
      if (!width || !height || !nodes.length) return;
      const positions = nodes.map(node => ({ id: node.id, x: node.x / width, y: node.y / height }));
      fetch('/api/graph/positions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ positions }),
        keepalive: true,
      }).then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      }).catch(error => console.warn('Could not save graph positions:', error));
    }

    function resetView() {

      applyTransform();
    }

    function selectNode(node) {
      selectedId = node?.id ?? null;
      const neighbours = new Set();
      if (node) for (const edge of graph.edges) {
        if (edge.source === node.id) neighbours.add(edge.target);
        if (edge.target === node.id) neighbours.add(edge.source);
      }
      nodeLayer.querySelectorAll('.node').forEach(group => {
        const id = Number(group.dataset.id);
        group.classList.toggle('selected', id === selectedId);
        group.classList.toggle('neighbour', neighbours.has(id));
        group.classList.toggle('muted', selectedId !== null && id !== selectedId && !neighbours.has(id));
      });
      edgeLayer.querySelectorAll('.edge').forEach(line => {
        const active = Number(line.dataset.source) === selectedId || Number(line.dataset.target) === selectedId;
        line.classList.toggle('muted', selectedId !== null && !active);

    }

    function render() {
      width = innerWidth; height = innerHeight;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      edgeLayer.replaceChildren();
      nodeLayer.replaceChildren();
      nodeById = new Map(graph.nodes.map(node => [node.id, node]));
      graph.edges.forEach(edge => {
        const line = el('line', { class: 'edge', pathLength: 1, 'stroke-width': 0.8 + edge.strength * 4, opacity: 0.24 + edge.strength * 0.65 });
        line.dataset.source = edge.source; line.dataset.target = edge.target;
        line.dataset.edgeKey = edgeKey(edge);
        const title = el('title'); title.textContent = `${nodeById.get(edge.source).label} ↔ ${nodeById.get(edge.target).label}: ${edge.similarity}`;
        line.append(title); edge.element = line; edgeLayer.append(line);
      });
      graph.nodes.forEach((node, index) => {
        node.detailsLoaded = node.facts.some(fact => Object.hasOwn(fact, 'highlight'));
        node.detailsPromise = null;
        // A golden-angle spiral gives an uncached graph a useful first spread.
        // Saved positions still take precedence and are never moved by simulation.
        const angle = index * Math.PI * (3 - Math.sqrt(5));
        const radial = Math.sqrt((index + .5) / Math.max(1, graph.nodes.length));
        const saved = Number.isFinite(node.position?.x) && Number.isFinite(node.position?.y);
        node.x = saved ? node.position.x * width : width / 2 + Math.cos(angle) * width * .42 * radial;
        node.y = saved ? node.position.y * height : height / 2 + Math.sin(angle) * height * .42 * radial;
        node.vx = node.vy = 0;
        node.fixed = saved;
        node.expanded = false;
        const group = el('g', { class: `node${node.fact_count > 1 ? ' expandable' : ''}` }); group.dataset.id = node.id;
        node.circle = el('circle', { r: nodeRadius(node) });
        group.append(node.circle);
        node.factLayer = buildFactLayer(node); group.append(node.factLayer);
        node.factBadge = buildFactBadge(node);
        if (node.factBadge) group.append(node.factBadge);
        node.labelOffset = nodeRadius(node) + 19;
        const labelGroup = el('g', { class: 'node-label', transform: `translate(0 ${node.labelOffset})` });
        const label = el('text'); label.textContent = node.label; labelGroup.append(label); group.append(labelGroup);
        node.labelElement = labelGroup;
        makeNodeDraggable(group, node);
        node.element = group; nodeLayer.append(group);
      });

      else drawLayout();
    }

    function tick() {
      const byId = new Map(graph.nodes.map(node => [node.id, node]));
      const movable = graph.nodes.filter(node => !node.fixed);
      graph.edges.forEach(edge => {
        const a = byId.get(edge.source), b = byId.get(edge.target);
        const dx = b.x - a.x, dy = b.y - a.y, distance = Math.hypot(dx, dy) || 1;
        const desired = 115 + (1 - edge.similarity) * 180;
        const force = (distance - desired) * (0.002 + edge.strength * .006);
        if (!a.fixed) { a.vx += dx / distance * force; a.vy += dy / distance * force; }
        if (!b.fixed) { b.vx -= dx / distance * force; b.vy -= dy / distance * force; }
      });

      // Index all nodes once, then repel each movable node only from nearby cells.
      // Typical graph updates have one movable node, making this O(nodes + edges)
      // instead of running an O(nodes²) all-pairs pass for every animation frame.
      const cellSize = 180;
      const grid = new Map();
      const cellKey = (x, y) => `${x}:${y}`;
      for (const node of graph.nodes) {
        const cellX = Math.floor(node.x / cellSize), cellY = Math.floor(node.y / cellSize);
        const key = cellKey(cellX, cellY);
        if (!grid.has(key)) grid.set(key, []);
        grid.get(key).push(node);
      }
      for (const node of movable) {
        const cellX = Math.floor(node.x / cellSize), cellY = Math.floor(node.y / cellSize);
        for (let x = cellX - 1; x <= cellX + 1; x++) for (let y = cellY - 1; y <= cellY + 1; y++) {
          for (const other of grid.get(cellKey(x, y)) || []) {
            if (other === node) continue;
            let dx = other.x - node.x, dy = other.y - node.y;
            let distance2 = dx * dx + dy * dy;
            if (distance2 < .01) {
              const angle = (Number(node.id) * 2.39996 + Number(other.id)) % (Math.PI * 2);
              dx = Math.cos(angle); dy = Math.sin(angle); distance2 = 1;
            }
            const distance = Math.sqrt(distance2);
            if (distance > 240) continue;
            const clearance = collapsedNodeRadius(node) + collapsedNodeRadius(other) + 34;
            const collisionForce = Math.max(0, clearance - distance) * .045;
            const force = Math.min(1.6, 1500 / distance2) + collisionForce;
            node.vx -= dx / distance * force;
            node.vy -= dy / distance * force;
          }
        }
      }
      for (const node of graph.nodes) {
        if (!node.fixed) {
          node.vx += (width / 2 - node.x) * .00045; node.vy += (height / 2 - node.y) * .00045;
          node.vx *= .88; node.vy *= .88;
          node.x = Math.max(40, Math.min(width - 40, node.x + node.vx));
          node.y = Math.max(40, Math.min(height - 40, node.y + node.vy));
        }
        node.element.setAttribute('transform', `translate(${node.x} ${node.y})`);
      }
      graph.edges.forEach(drawEdge);
    }

    function simulate(frames) {
      cancelAnimationFrame(animationFrame);
      const run = () => {
        tick();
        if (--frames > 0) animationFrame = requestAnimationFrame(run);
        else {
          animationFrame = null;
          graph.nodes.forEach(node => { node.fixed = true; });
          persistPositions(graph.nodes);
        }
      };
      run();
    }

    function graphPoint(event) {
      return { x: (event.clientX - transform.x) / transform.k, y: (event.clientY - transform.y) / transform.k };
    }
    function openHoveredNodeFact(node) {
      if (!node?.facts?.length) return;
      selectNode(node);
      if (node.fact_count > 1) {
        if (activeEntity !== 'facts' || selectedFactId !== null || Number(factFilterNodeId) !== Number(node.id)) {
          openConceptFactList(node);
        }
        return;
      }
      if (activeEntity !== 'facts' || Number(selectedFactId) !== Number(node.facts[0].id)) {
        openFactEditor(node.facts[0].id);
      }
    }
    function makeNodeDraggable(element, node) {
      element.addEventListener('dblclick', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        clearTimeout(nodeOpenTimer);
        openLabelDialog(node.facts.map(fact => fact.id), node.label, node.fact_count > 1);
      });
      element.addEventListener('pointerenter', event => {
        hoveredGraphNode = node;
        if (event.ctrlKey) openHoveredNodeFact(node);
      });
      element.addEventListener('pointerleave', () => {
        if (hoveredGraphNode === node) hoveredGraphNode = null;
      });
      element.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.stopPropagation();
        cancelGrowthAnimation();
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
          graph.nodes.forEach(item => { item.fixed = true; });
          persistPositions(graph.nodes);
        }
        element.setPointerCapture(event.pointerId); node.fixed = true;
        const startClient = { x: event.clientX, y: event.clientY };
        let dragged = false;
        const move = moveEvent => {
          if (Math.hypot(moveEvent.clientX - startClient.x, moveEvent.clientY - startClient.y) > 5) dragged = true;
          if (!dragged) return;
          const point = graphPoint(moveEvent);
          node.x = point.x; node.y = point.y;
          drawNode(node);
          scheduleDocumentLinks();
        };
        const up = upEvent => {
          if (element.hasPointerCapture(upEvent.pointerId)) element.releasePointerCapture(upEvent.pointerId);
          element.removeEventListener('pointermove', move);
          element.removeEventListener('pointerup', up);
          element.removeEventListener('pointercancel', up);
          if (dragged) persistPositions([node]);
          else if (upEvent.type === 'pointerup' && upEvent.button === 0) {
            clearTimeout(nodeOpenTimer);
            nodeOpenTimer = setTimeout(() => openFocusedConcept(node), 230);
          }
        };
        element.addEventListener('pointermove', move);
        element.addEventListener('pointerup', up);
        element.addEventListener('pointercancel', up);
      });
    }

    let pan = null;
    conceptGraph.addEventListener('pointerdown', event => {
      if (event.target.closest?.('.concept-fact-node')) return;
      conceptPan = {
        x: event.clientX,
        y: event.clientY,
        tx: conceptTransform.x,
        ty: conceptTransform.y,
      };
      conceptGraph.setPointerCapture(event.pointerId);
      conceptGraph.classList.add('panning');
    });
    conceptGraph.addEventListener('pointermove', event => {
      if (!conceptPan) return;
      conceptTransform.x = conceptPan.tx + event.clientX - conceptPan.x;
      conceptTransform.y = conceptPan.ty + event.clientY - conceptPan.y;
      applyConceptTransform();
    });
    const finishConceptPan = event => {
      if (!conceptPan) return;
      conceptPan = null;
      if (conceptGraph.hasPointerCapture(event.pointerId)) conceptGraph.releasePointerCapture(event.pointerId);
      conceptGraph.classList.remove('panning');
    };
    conceptGraph.addEventListener('pointerup', finishConceptPan);
    conceptGraph.addEventListener('pointercancel', finishConceptPan);
    conceptGraph.addEventListener('wheel', event => {
      event.preventDefault();
      const box = conceptGraph.getBoundingClientRect();
      const pointerX = event.clientX - box.left;
      const pointerY = event.clientY - box.top;
      const previous = conceptTransform.k;
      const next = Math.max(.45, Math.min(4.5, previous * Math.exp(-event.deltaY * .001)));
      conceptTransform.x = pointerX - (pointerX - conceptTransform.x) * next / previous;
      conceptTransform.y = pointerY - (pointerY - conceptTransform.y) * next / previous;
      conceptTransform.k = next;
      applyConceptTransform();
    }, { passive: false });
    function handleEmptyGraphContext(event) {

    conceptView.addEventListener('contextmenu', handleEmptyGraphContext);

    svg.addEventListener('dblclick', event => {

    svg.addEventListener('pointerdown', event => {

    });
    svg.addEventListener('wheel', event => {

      transform.y = event.clientY - (event.clientY - transform.y) * next / previous;
      transform.k = next; applyTransform();
    }, { passive: false });
    document.querySelector('#reset').addEventListener('click', resetView);
    undoButton.addEventListener('click', () => moveGraphHistory('undo'));
    redoButton.addEventListener('click', () => moveGraphHistory('redo'));
    entityAction.addEventListener('click', () => {

    entityPanel.addEventListener('contextmenu', event => {

    document.querySelector('#fact-cancel').addEventListener('click', closeFactDialog);

      if (previousWidth && previousHeight) graph.nodes.forEach(node => {
        node.x *= width / previousWidth;
        node.y *= height / previousHeight;
      });
      drawLayout();
      if (!conceptView.hidden && focusedNodeId !== null) {
        const node = nodeById.get(focusedNodeId);
        if (node) renderConceptView(node, false);
      }
      if (activeModelBox) positionQueuePanel(activeModelBox);
      scheduleDocumentLinks();
    });
    addEventListener('pagehide', () => { if (graph?.nodes) persistPositions(graph.nodes); });

    async function runPerformanceAutoplay() {
      const parameters = new URLSearchParams(location.search);
      const run = parameters.get('perf-run') || 'default';
      const storageKey = `livebook-perf-autoplay-recovered-${run}`;
      if (parameters.get('perf-autoplay') !== '1' || sessionStorage.getItem(storageKey) === 'done') return;
      sessionStorage.setItem(storageKey, 'done');
      const target = documents.find(document => document.recovered && document.name === 'transformer_shapes_explained.md');
      if (!target) return;
      resetView();
      selectEntity('docs');
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const delay = Math.max(0, Math.min(3000, Number(parameters.get('perf-delay')) || 0));
      if (delay) await new Promise(resolve => setTimeout(resolve, delay));
      const suite = parameters.get('perf-suite');
      const variants = suite === 'layers'
        ? ['baseline', 'no-overlays', 'no-filters', 'no-text', 'no-edges', 'no-nodes']
        : suite === 'text'
          ? ['baseline', 'text-no-stroke', 'text-simple', 'text-transparent', 'no-text']
          : suite === 'label-architecture'
            ? ['baseline', 'small-canvas-labels', 'no-text']
          : [parameters.get('perf-variant') || 'baseline'];
      for (const variant of variants) {
        document.documentElement.dataset.perfVariant = variant;
        prepareHtmlLabels(variant === 'html-labels' || variant === 'html-static-labels');
        if (variant === 'html-static-labels') positionStaticHtmlLabels(transform);
        prepareCanvasLabels(variant === 'canvas-labels' || variant === 'canvas-static-labels');
        if (variant === 'canvas-static-labels') drawStaticCanvasLabels(transform);
        prepareSmallCanvasLabels(variant === 'small-canvas-labels');
        resetView();
        selectedDocumentId = null;
        selectedDocument = null;
        documentSelection = null;
        renderDocumentsList();
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await openDocument(target.id);
        await new Promise(resolve => setTimeout(resolve, 1450));
        clearDocumentFactHover();
        clearDocumentGraphFocus();
        selectedDocumentId = null;
        selectedDocument = null;
        documentSelection = null;
        renderDocumentsList();
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      prepareHtmlLabels(false);
      prepareCanvasLabels(false);
      prepareSmallCanvasLabels(false);
      delete document.documentElement.dataset.perfVariant;
    }

    fetch('/api/graph').then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then(data => {
      graph = data;
      if (!graph.nodes.length) document.body.insertAdjacentHTML('beforeend', '<div class="empty">No stored passages yet.</div>');
      else render();
      const initialLoads = [loadFacts(), loadDocuments(), loadAgentPlugins(), loadChats()];
      Promise.all(initialLoads).then(async () => {
        window.__ARBRELLIS_READY__ = true;
        await runPerformanceAutoplay();
      })
        .catch(error => console.warn('Could not load initial workspace data:', error));
      loadHistoryStatus();
    }).catch(error => {
      const message = document.createElement('div'); message.className = 'error'; message.textContent = `Could not load graph: ${error.message}`; document.body.append(message);
    });
  </script>
</body>
</html>
