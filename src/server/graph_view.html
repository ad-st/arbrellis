<!doctype html>
<html lang="en">
<head>

  <title>Arbrellis</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">

  <style>
    :root {

    html[data-perf-variant="no-edges"] #edges { display: none !important; }
    html[data-perf-variant="no-nodes"] #nodes { visibility: hidden !important; }
    #graph.panning { cursor: grabbing; }
    .edge { stroke: #6b8f80; stroke-linecap: round; transition: opacity .18s, stroke .18s; }
    .document-focus-hidden { display: none; }
    #edges.document-focus-active .edge-removed-wrap { display: none; }
    .edge.edge-new {
      stroke: #8ff5c8;
      stroke-dasharray: .1 .9;

      filter: drop-shadow(0 0 4px rgba(126, 226, 184, .72));

    .edge.edge-removed {
      stroke: #f0a080;

    @keyframes edge-roundtrip {

    @keyframes breathe-edge { 50% { stroke: #fff0a7; filter: drop-shadow(0 0 8px rgba(255, 231, 147, .88)); } }

    .knowledge-halo { pointer-events: none; }

    .node.node-new-pending { opacity: 0; }
    .node.node-new > circle { animation: knowledge-born .82s cubic-bezier(.18, .9, .25, 1.25); }
    @keyframes knowledge-breathe {

      50% { filter: url(#node-glow) drop-shadow(0 0 17px rgba(255, 226, 126, .96)); }
    }
    @keyframes knowledge-ring {

      72%, 100% { transform: scale(1.42); opacity: 0; }
    }

      100% { transform: scale(1); opacity: 1; }
    }
    .fact-layer { pointer-events: none; }
    .node.concept-opening .fact-layer { display: none; }
    .fact-edge { stroke: rgba(180, 226, 206, .34); stroke-width: 1; }

      filter: drop-shadow(0 0 4px rgba(126, 226, 184, .28));

    .fact-caption-box { overflow: visible; }
    .fact-caption {

      padding: 5px 6px;
      overflow: hidden;
      color: #dcebe4;

      text-align: center;
      overflow-wrap: anywhere;

      -webkit-line-clamp: 3;

    .concept-view {
      --origin-x: 50vw;
      --origin-y: 50vh;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      border: 2px solid rgba(151, 244, 204, .9);
      background:

        #123a2b;

        inset 0 0 44px rgba(126, 226, 184, .24),
        inset 0 0 3px rgba(226, 255, 242, .9),

                 concept-edge-glow 2.4s ease-in-out .72s infinite;
    }
    .concept-view[hidden] { display: none; }
    .concept-view::before {
      content: '';

      z-index: 2;
      left: var(--origin-x);
      top: var(--origin-y);
      width: 296vmax;
      height: 296vmax;
      pointer-events: none;
      border: 2px solid #c5ffe4;
      border-radius: 50%;
      box-shadow: inset 0 0 18px rgba(197, 255, 228, .5), 0 0 22px rgba(126, 226, 184, .88);
      animation: concept-circle-grow .72s cubic-bezier(.18, .82, .24, 1) both;
    }

      to { opacity: 1; clip-path: circle(150vmax at var(--origin-x) var(--origin-y)); }
    }
    @keyframes concept-circle-grow {

    @keyframes concept-edge-glow {

    #concept-graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #concept-graph.panning { cursor: grabbing; }

      stroke-width: 2;

    .concept-fact-node { cursor: pointer; user-select: none; -webkit-user-select: none; }
    .concept-fact-node rect { stroke-width: 1.7; }

    .concept-fact-caption {

      padding: 12px 15px;
      overflow: hidden;
      color: #edfff7;
      font: 540 14px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      overflow-wrap: anywhere;
      user-select: none;
      -webkit-user-select: none;

      const desiredX = Math.max(bounds.left + halfWidth, Math.min(bounds.right - halfWidth, currentX));
      const desiredY = Math.max(bounds.top + halfHeight, Math.min(bounds.bottom - halfHeight, currentY));
      if (Math.abs(desiredX - currentX) < 1 && Math.abs(desiredY - currentY) < 1) return true;
      if (!conceptView.hidden) {
        animateConceptTransform({
          ...conceptTransform,
          x: conceptTransform.x + desiredX - currentX,
          y: conceptTransform.y + desiredY - currentY,
        });
      } else {
        animateTransform({
          ...transform,
          x: transform.x + desiredX - currentX,
          y: transform.y + desiredY - currentY,
        });
      }
      return true;
    }

    function documentTerminalNodeIds(doc) {
      const factToNode = new Map();
      graph.nodes.forEach(node => node.facts.forEach(fact => factToNode.set(Number(fact.id), node.id)));
      return [...new Set((doc?.facts || [])
        .map(fact => factToNode.get(Number(fact.id)))
        .filter(id => id !== undefined))];
    }

    function documentConnectorSubgraph(terminalIds) {
      const includedNodeIds = new Set(terminalIds);
      const includedEdgeKeys = new Set();
      if (terminalIds.length < 2) return { includedNodeIds, includedEdgeKeys };

      const adjacency = new Map(graph.nodes.map(node => [node.id, []]));
      graph.edges.forEach(edge => {
        // Strong semantic edges are cheaper, while every existing edge remains usable.
        const cost = Math.max(.001, 1 - Math.max(-1, Math.min(1, Number(edge.similarity))));
        adjacency.get(edge.source)?.push({ id: edge.target, cost });
        adjacency.get(edge.target)?.push({ id: edge.source, cost });
      });

      const shortestFrom = source => {
        const distance = new Map([[source, 0]]);
        const previous = new Map();
        const heap = [[0, source]];
        const push = item => {
          heap.push(item);
          let index = heap.length - 1;
          while (index > 0) {
            const parent = Math.floor((index - 1) / 2);
            if (heap[parent][0] <= item[0]) break;
            heap[index] = heap[parent]; index = parent;
          }
          heap[index] = item;
        };
        const pop = () => {
          const first = heap[0], last = heap.pop();
          if (heap.length && last) {
            let index = 0;
            while (true) {
              let child = index * 2 + 1;
              if (child >= heap.length) break;
              if (child + 1 < heap.length && heap[child + 1][0] < heap[child][0]) child++;
              if (heap[child][0] >= last[0]) break;
              heap[index] = heap[child]; index = child;
            }
            heap[index] = last;
          }
          return first;
        };
        while (heap.length) {
          const [currentDistance, current] = pop();
          if (currentDistance !== distance.get(current)) continue;
          for (const neighbour of adjacency.get(current) || []) {
            const candidate = currentDistance + neighbour.cost;
            if (candidate >= (distance.get(neighbour.id) ?? Infinity)) continue;
            distance.set(neighbour.id, candidate);
            previous.set(neighbour.id, current);
            push([candidate, neighbour.id]);
          }
        }
        return { distance, previous };
      };

      // Connect the document concepts with an MST over their shortest-path metric.
      // Expanding those paths gives a compact Steiner-tree approximation.
      const paths = new Map();
      const candidates = [];
      terminalIds.forEach((source, index) => {
        const result = shortestFrom(source);
        paths.set(source, result.previous);
        for (let other = index + 1; other < terminalIds.length; other++) {
          const target = terminalIds[other];
          const distance = result.distance.get(target);
          if (distance !== undefined) candidates.push({ source, target, distance });
        }
      });
      candidates.sort((left, right) => left.distance - right.distance);
      const parent = new Map(terminalIds.map(id => [id, id]));
      const find = id => {
        let root = id;
        while (parent.get(root) !== root) root = parent.get(root);
        while (parent.get(id) !== id) { const next = parent.get(id); parent.set(id, root); id = next; }
        return root;
      };
      for (const candidate of candidates) {
        const left = find(candidate.source), right = find(candidate.target);
        if (left === right) continue;
        parent.set(left, right);
        const previous = paths.get(candidate.source);
        let current = candidate.target;
        while (current !== candidate.source) {
          const before = previous.get(current);
          if (before === undefined) break;
          includedNodeIds.add(before); includedNodeIds.add(current);
          includedEdgeKeys.add(edgeKey({ source: before, target: current }));
          current = before;
        }
      }
      return { includedNodeIds, includedEdgeKeys };
    }

    function setDocumentGraphVisibility(includedNodeIds = null, includedEdgeKeys = null) {
      const active = includedNodeIds !== null;
      graph.nodes.forEach(node => node.element?.classList.toggle(
        'document-focus-hidden', active && !includedNodeIds.has(node.id)
      ));
      graph.edges.forEach(edge => edge.element?.classList.toggle(
        'document-focus-hidden', active && !includedEdgeKeys.has(edgeKey(edge))
      ));
      edgeLayer.classList.toggle('document-focus-active', active);
      if (!htmlLabelLayer.hidden) {
        htmlLabelLayer.querySelectorAll('.html-node-label').forEach(label => {
          label.hidden = active && !includedNodeIds.has(Number(label.dataset.nodeId));
        });
      }
      if (!canvasLabelLayer.hidden) {
        if (document.documentElement.dataset.perfVariant === 'canvas-static-labels') {
          drawStaticCanvasLabels(transform, active ? includedNodeIds : null);
        } else drawCanvasLabels(active ? includedNodeIds : null);
      }
      if (!smallCanvasLabelLayer.hidden) positionSmallCanvasLabels(transform, active ? includedNodeIds : null);
    }

    function prepareHtmlLabels(enabled) {
      htmlLabelLayer.hidden = !enabled;
      if (!enabled || !graph?.nodes) return;
      htmlLabelLayer.replaceChildren(...graph.nodes.map(node => {
        const label = document.createElement('div');
        label.className = 'html-node-label';
        label.dataset.nodeId = node.id;
        label.textContent = node.label;
        label.style.left = `${node.x}px`;
        label.style.top = `${node.y + node.labelOffset}px`;
        return label;
      }));
      htmlLabelLayer.style.transform = viewportTransformCss(transform);
    }

    function positionStaticHtmlLabels(camera) {
      htmlLabelLayer.style.transform = 'none';
      htmlLabelLayer.querySelectorAll('.html-node-label').forEach(label => {
        const node = nodeById.get(Number(label.dataset.nodeId));
        if (!node) return;
        label.style.left = `${camera.x + node.x * camera.k}px`;
        label.style.top = `${camera.y + (node.y + node.labelOffset) * camera.k}px`;
        label.style.fontSize = `${12 * camera.k}px`;
      });
    }

    function drawCanvasLabels(includedNodeIds = null) {
      if (!graph?.nodes) return;
      const ratio = devicePixelRatio || 1;
      canvasLabelLayer.width = Math.round(width * ratio);
      canvasLabelLayer.height = Math.round(height * ratio);
      canvasLabelLayer.style.width = `${width}px`;
      canvasLabelLayer.style.height = `${height}px`;
      const context = canvasLabelLayer.getContext('2d');
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.font = '560 12px Inter, ui-sans-serif, system-ui, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'top';
      context.lineJoin = 'round';
      context.lineWidth = 4;
      for (const node of graph.nodes) {
        if (includedNodeIds && !includedNodeIds.has(node.id)) continue;
        const y = node.y + node.labelOffset;
        context.strokeStyle = '#07100e';
        context.strokeText(node.label, node.x, y);
        context.fillStyle = '#e8f6ef';
        context.fillText(node.label, node.x, y);
      }
    }

    function prepareCanvasLabels(enabled) {
      canvasLabelLayer.hidden = !enabled;
      if (!enabled) return;
      drawCanvasLabels(documentGraphFocus?.includedNodeIds || null);
      canvasLabelLayer.style.transform = viewportTransformCss(transform);
    }

    function drawStaticCanvasLabels(camera, includedNodeIds = null) {
      if (!graph?.nodes) return;
      const ratio = devicePixelRatio || 1;
      canvasLabelLayer.width = Math.round(width * ratio);
      canvasLabelLayer.height = Math.round(height * ratio);
      canvasLabelLayer.style.width = `${width}px`;
      canvasLabelLayer.style.height = `${height}px`;
      canvasLabelLayer.style.transform = 'none';
      const context = canvasLabelLayer.getContext('2d');
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.font = `560 ${12 * camera.k}px Inter, ui-sans-serif, system-ui, sans-serif`;
      context.textAlign = 'center';
      context.textBaseline = 'top';
      context.lineJoin = 'round';
      context.lineWidth = Math.max(2, 4 * camera.k);
      for (const node of graph.nodes) {
        if (includedNodeIds && !includedNodeIds.has(node.id)) continue;
        const x = camera.x + node.x * camera.k;
        const y = camera.y + (node.y + node.labelOffset) * camera.k;
        context.strokeStyle = '#07100e';
        context.strokeText(node.label, x, y);
        context.fillStyle = '#e8f6ef';
        context.fillText(node.label, x, y);
      }
    }

    function prepareSmallCanvasLabels(enabled) {
      smallCanvasLabelLayer.hidden = !enabled;
      if (!enabled || !graph?.nodes) return;
      const ratio = devicePixelRatio || 1;
      smallCanvasLabelLayer.replaceChildren(...graph.nodes.map(node => {
        const canvas = document.createElement('canvas');
        canvas.className = 'small-canvas-node-label';
        canvas.dataset.nodeId = node.id;
        canvas.width = Math.round(260 * ratio);
        canvas.height = Math.round(28 * ratio);
        canvas.style.width = '260px';
        canvas.style.height = '28px';
        const context = canvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.font = '560 12px Inter, ui-sans-serif, system-ui, sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'top';
        context.lineJoin = 'round';
        context.lineWidth = 4;
        context.strokeStyle = '#07100e';
        context.strokeText(node.label, 130, 2);
        context.fillStyle = '#e8f6ef';
        context.fillText(node.label, 130, 2);
        return canvas;
      }));
      positionSmallCanvasLabels(transform, documentGraphFocus?.includedNodeIds || null);
    }

    function positionSmallCanvasLabels(camera, includedNodeIds = null) {
      smallCanvasLabelLayer.querySelectorAll('.small-canvas-node-label').forEach(canvas => {
        const node = nodeById.get(Number(canvas.dataset.nodeId));
        if (!node) return;
        canvas.hidden = Boolean(includedNodeIds && !includedNodeIds.has(node.id));
        const scale = camera.k;
        canvas.style.left = `${camera.x + node.x * scale - 130 * scale}px`;
        canvas.style.top = `${camera.y + (node.y + node.labelOffset) * scale}px`;
        canvas.style.width = `${260 * scale}px`;
        canvas.style.height = `${28 * scale}px`;
      });
    }

    function fitDocumentSubgraph(includedNodeIds) {
      const nodes = graph.nodes.filter(node => includedNodeIds.has(node.id));
      if (!nodes.length) return;
      const bounds = visibleGraphBounds();
      const left = Math.min(...nodes.map(node => node.x - nodeRadius(node) - 22));
      const right = Math.max(...nodes.map(node => node.x + nodeRadius(node) + 22));
      const top = Math.min(...nodes.map(node => node.y - nodeRadius(node) - 34));
      const bottom = Math.max(...nodes.map(node => node.y + nodeRadius(node) + 34));
      const availableWidth = Math.max(120, bounds.right - bounds.left);
      const availableHeight = Math.max(120, bounds.bottom - bounds.top);
      const graphWidth = Math.max(90, right - left);
      const graphHeight = Math.max(90, bottom - top);
      const k = Math.max(.35, Math.min(2.2, availableWidth / graphWidth, availableHeight / graphHeight));
      animateTransform({
        k,
        x: (bounds.left + bounds.right) / 2 - (left + right) / 2 * k,
        y: (bounds.top + bounds.bottom) / 2 - (top + bottom) / 2 * k,
      });
    }

    function applyDocumentGraphFocus(doc, { fit = true, sourceKey = `document:${Number(doc.id)}` } = {}) {
      if (!graph?.nodes) return;
      const terminals = documentTerminalNodeIds(doc);
      if (!terminals.length) {
        clearDocumentGraphFocus();
        setDocumentGraphVisibility();
        scheduleDocumentLinks();
        return;
      }
      if (!documentGraphFocus) {
        documentGraphFocus = {
          sourceKey,
          snapshot: {
            transform: { ...transform },
            selectedId,
            focusedNodeId,
            conceptVisible: !conceptView.hidden,
            conceptTransform: { ...conceptTransform },
            focusReturnTransform: focusReturnTransform ? { ...focusReturnTransform } : null,
          },
          includedNodeIds: new Set(),
          includedEdgeKeys: new Set(),
        };
        if (focusedNodeId !== null) closeFocusedConcept({ restoreView: false });
      }
      documentGraphFocus.sourceKey = sourceKey;
      const subgraph = documentConnectorSubgraph(terminals);
      documentGraphFocus.includedNodeIds = subgraph.includedNodeIds;
      documentGraphFocus.includedEdgeKeys = subgraph.includedEdgeKeys;
      setDocumentGraphVisibility(subgraph.includedNodeIds, subgraph.includedEdgeKeys);
      selectNode(null);
      if (fit) requestAnimationFrame(() => fitDocumentSubgraph(subgraph.includedNodeIds));
      scheduleDocumentLinks();
    }

    function restoreDocumentConcept(snapshot) {
      if (!snapshot.conceptVisible || snapshot.focusedNodeId === null) return;
      const node = nodeById.get(snapshot.focusedNodeId);
      if (!node) return;
      focusedNodeId = node.id;
      focusReturnTransform = snapshot.focusReturnTransform ? { ...snapshot.focusReturnTransform } : null;
      loadConceptDetails(node).then(() => {
        if (documentGraphFocus) return;
        conceptTransform = { ...snapshot.conceptTransform };
        renderConceptView(node, false);
        conceptView.hidden = false;
        conceptView.setAttribute('aria-hidden', 'false');
        selectNode(node);
      }).catch(error => console.warn('Could not restore concept view:', error));
    }

    function clearDocumentGraphFocus({ restore = true } = {}) {
      documentFocusGeneration += 1;
      if (!documentGraphFocus) return;
      const { snapshot } = documentGraphFocus;
      documentGraphFocus = null;
      cancelViewAnimation();
      setDocumentGraphVisibility();
      if (restore) {
        transform = { ...snapshot.transform };
        applyTransform();
        selectNode(snapshot.selectedId === null ? null : nodeById.get(snapshot.selectedId) || null);
        restoreDocumentConcept(snapshot);
      }
      scheduleDocumentLinks();
    }

    function documentMarkedRects(selector, visibleOnly = false) {
      const marks = [...entityContent.querySelectorAll(selector)];
      const preview = visibleOnly ? entityContent.querySelector('.document-preview') : null;
      const clip = preview?.getBoundingClientRect();
      return marks.flatMap(mark => [...mark.getClientRects()].map(rect => {
        if (!clip) return rect;
        const left = Math.max(rect.left, clip.left, 0);
        const right = Math.min(rect.right, clip.right, innerWidth);
        const top = Math.max(rect.top, clip.top, 0);
        const bottom = Math.min(rect.bottom, clip.bottom, innerHeight);
        if (right <= left || bottom <= top) return null;
        // Do not connect through controls or another panel covering this line.
        const sample = document.elementFromPoint(Math.min(right - 1, left + 4), (top + bottom) / 2);
        return sample?.closest?.(selector)
          ? { left, right, top, bottom, width: right - left, height: bottom - top }
          : null;
      })).filter(rect => rect && (rect.width || rect.height));
    }

    const documentFactRects = (factId, visibleOnly = false) => documentMarkedRects(
      `.document-fact-extract[data-fact-id="${Number(factId)}"]`, visibleOnly
    );
    const documentAnnotationRects = (annotationId, visibleOnly = false) => documentMarkedRects(
      `.document-annotation[data-annotation-id="${Number(annotationId)}"]`, visibleOnly
    );

    function documentFactEnvelope(factId, visibleOnly = false) {
      const rects = documentFactRects(factId, visibleOnly);
      if (!rects.length) return null;
      return {
        left: Math.min(...rects.map(rect => rect.left)),
        right: Math.max(...rects.map(rect => rect.right)),
        top: Math.min(...rects.map(rect => rect.top)),
        bottom: Math.max(...rects.map(rect => rect.bottom)),
      };
    }

    function setDocumentLinkVisible(visible) {
      // SVG elements do not implement HTMLElement.hidden. Assigning to
      // `documentLinkOverlay.hidden` only creates a JS property and leaves the
      // actual `hidden` attribute (and its display:none rule) untouched.
      documentLinkOverlay.toggleAttribute('hidden', !visible);
      documentLinkOverlay.setAttribute('aria-hidden', String(!visible));
    }

    function setDocumentHighlightsVisible(visible) {
      documentHighlightOverlay.toggleAttribute('hidden', !visible);
      documentHighlightOverlay.setAttribute('aria-hidden', String(!visible));
    }

    function documentBlockPath(rects) {
      const preview = entityContent.querySelector('.document-preview');
      const clip = preview?.getBoundingClientRect();
      if (!clip) return '';
      rects.sort((a, b) => a.top - b.top || a.left - b.left);
      const lines = [];
      for (const rect of rects) {
        let line = lines.find(candidate => Math.abs(candidate.top - rect.top) < 2.5 && Math.abs(candidate.bottom - rect.bottom) < 2.5);
        if (!line) {
          line = { left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom };
          lines.push(line);
        } else {
          line.left = Math.min(line.left, rect.left); line.right = Math.max(line.right, rect.right);
          line.top = Math.min(line.top, rect.top); line.bottom = Math.max(line.bottom, rect.bottom);
        }
      }
      lines.sort((a, b) => a.top - b.top).forEach(line => {
        line.left = Math.max(clip.left, line.left - 2.5); line.right = Math.min(clip.right, line.right + 2.5);
        line.top = Math.max(clip.top, line.top - 1.5); line.bottom = Math.min(clip.bottom, line.bottom + 1.5);
      });
      if (!lines.length) return '';
      const commands = [`M ${lines[0].left} ${lines[0].top}`, `H ${lines[0].right}`];
      for (let index = 0; index < lines.length; index += 1) {
        commands.push(`V ${lines[index].bottom}`);
        if (index + 1 < lines.length) commands.push(`H ${lines[index + 1].right}`);
      }
      commands.push(`H ${lines.at(-1).left}`);
      for (let index = lines.length - 1; index >= 0; index -= 1) {
        commands.push(`V ${lines[index].top}`);
        if (index > 0) commands.push(`H ${lines[index - 1].left}`);
      }
      commands.push('Z');
      return commands.join(' ');
    }

    const documentHighlightPath = factId => documentBlockPath(documentFactRects(factId, true));
    const documentAnnotationPath = annotationId => documentBlockPath(documentAnnotationRects(annotationId, true));

    function drawDocumentHighlights(preview, factIds) {
      const existing = new Map([...documentHighlightLayer.querySelectorAll('[data-fact-id]')]
        .map(path => [Number(path.dataset.factId), path]));
      const visible = new Set();
      for (const factId of factIds) {
        const d = documentHighlightPath(factId);
        if (!d) continue;
        let path = existing.get(factId);
        if (!path) {
          path = document.createElementNS(NS, 'path'); path.classList.add('document-highlight-shape');
          path.dataset.factId = factId; documentHighlightLayer.append(path);
        }
        path.setAttribute('d', d);
        path.classList.toggle('is-active', hoveredDocumentFactId === factId);
        path.classList.toggle('is-source-focus', Boolean(preview.querySelector(`.document-fact-extract.is-source-focus[data-fact-id="${factId}"]`)));
        visible.add(factId);
      }
      for (const [factId, path] of existing) if (!visible.has(factId)) path.remove();
      const annotationIds = [...new Set([...preview.querySelectorAll('.document-annotation')]
        .map(mark => Number(mark.dataset.annotationId)))];
      const existingAnnotations = new Map([...documentHighlightLayer.querySelectorAll('[data-annotation-id]')]
        .map(path => [Number(path.dataset.annotationId), path]));
      const visibleAnnotations = new Set();
      for (const annotationId of annotationIds) {
        const d = documentAnnotationPath(annotationId);
        if (!d) continue;
        let path = existingAnnotations.get(annotationId);
        if (!path) {
          path = document.createElementNS(NS, 'path');
          path.classList.add('document-annotation-shape');
          path.dataset.annotationId = annotationId;
          documentHighlightLayer.append(path);
        }
        path.setAttribute('d', d);
        path.classList.toggle('is-active', hoveredAnnotationId === annotationId);
        visibleAnnotations.add(annotationId);
      }
      for (const [annotationId, path] of existingAnnotations) {
        if (!visibleAnnotations.has(annotationId)) path.remove();
      }
      setDocumentHighlightsVisible(Boolean(visible.size || visibleAnnotations.size));
    }

    function drawDocumentLinks() {
      const preview = entityContent.querySelector('.document-preview');
      if (!preview || entityPanel.hidden || !['docs', 'chats'].includes(activeEntity)) {
        documentLinkLayer.replaceChildren();
        documentHighlightLayer.replaceChildren();
        setDocumentLinkVisible(false);
        setDocumentHighlightsVisible(false);
        return;
      }
      const bounds = visibleGraphBounds();
      const existing = new Map([...documentLinkLayer.children].map(path => [Number(path.dataset.factId), path]));
      const factIds = [...new Set([...preview.querySelectorAll('.document-fact-extract')]
        .map(mark => Number(mark.dataset.factId)))];
      drawDocumentHighlights(preview, factIds);
      const visible = new Set();
      const linkedFactIds = hoveredDocumentFactId !== null && factIds.includes(hoveredDocumentFactId)
        ? [hoveredDocumentFactId]
        : [];
      for (const factId of linkedFactIds) {
        const target = factTargetElement(factId);
        const block = documentFactEnvelope(factId, true);
        if (!target || !block) continue;
        const targetRect = target.getBoundingClientRect();
        const x1 = targetRect.left + targetRect.width / 2;
        const y1 = targetRect.top + targetRect.height / 2;
        if (x1 < bounds.left || x1 > bounds.right || y1 < bounds.top || y1 > bounds.bottom) continue;
        const x2 = block.left;
        const y2 = (block.top + block.bottom) / 2;
        const bend = Math.max(40, Math.abs(x2 - x1) * .42);
        const direction = x2 >= x1 ? 1 : -1;
        let path = existing.get(factId);
        if (!path) {
          path = document.createElementNS(NS, 'path');
          path.classList.add('document-link-path');
          path.dataset.factId = factId;
          documentLinkLayer.append(path);
        }
        path.classList.add('is-active');
        path.setAttribute('d', `M ${x1} ${y1} C ${x1 + bend * direction} ${y1}, ${x2 - bend * direction} ${y2}, ${x2} ${y2}`);
        visible.add(factId);
      }
      for (const [factId, path] of existing) if (!visible.has(factId)) path.remove();
      setDocumentLinkVisible(Boolean(visible.size));
    }

    function scheduleDocumentLinks() {
      if (documentLinkFrame !== null) return;
      documentLinkFrame = requestAnimationFrame(() => {
        documentLinkFrame = null;
        drawDocumentLinks();
      });
    }

    function hoverDocumentFact(factId) {
      const id = Number(factId);
      if (hoveredDocumentFactId === id) return;
      hoveredDocumentFactId = id;
      selectFactInCurrentView(id);
      if (!ensureFactTargetVisible(id)) {
        clearFactInCurrentView();
        scheduleDocumentLinks();
        return;
      }
      scheduleDocumentLinks();
    }

    function clearDocumentFactHover() {
      const hadHover = hoveredDocumentFactId !== null;
      hoveredDocumentFactId = null;
      if (hadHover) clearFactInCurrentView();
      scheduleDocumentLinks();
    }

    function documentFactAtPoint(preview, clientX, clientY) {
      const direct = document.elementFromPoint(clientX, clientY)?.closest?.('.document-fact-extract');
      if (direct && preview.contains(direct)) return Number(direct.dataset.factId);
      const candidates = [...preview.querySelectorAll('.document-fact-extract')]
        .map(mark => ({ id: Number(mark.dataset.factId), envelope: documentFactEnvelope(mark.dataset.factId) }))
        .filter(item => item.envelope
          && clientX >= item.envelope.left - 5 && clientX <= item.envelope.right + 5
          && clientY >= item.envelope.top - 4 && clientY <= item.envelope.bottom + 4)
        .sort((a, b) => (a.envelope.bottom - a.envelope.top) - (b.envelope.bottom - b.envelope.top));
      return candidates[0]?.id ?? null;
    }

    function documentAnnotationAtPoint(root, clientX, clientY) {
      const direct = document.elementFromPoint(clientX, clientY)?.closest?.('.document-annotation');
      if (direct && root.contains(direct)) return Number(direct.dataset.annotationId);
      const point = new DOMPoint(clientX, clientY);
      const paths = [...documentHighlightLayer.querySelectorAll('.document-annotation-shape')];
      for (const path of paths) {
        if (typeof path.isPointInFill === 'function' && path.isPointInFill(point)) {
          return Number(path.dataset.annotationId);
        }
      }
      return null;
    }

    const bindFactHover = (element, factId) => {
      element.addEventListener('mouseenter', () => {
        selectFactInCurrentView(factId);
      });
      element.addEventListener('mouseleave', clearFactInCurrentView);
    };
    const formatFactDate = value => {
      const date = new Date(String(value).replace(' ', 'T') + 'Z');
      return Number.isNaN(date.getTime()) ? String(value || '') : date.toLocaleString();
    };

    function openFactDialog() {
      factStatus.textContent = '';

        ? { ...focusReturnTransform }

      controls.forEach(control => { control.disabled = true; });
      labelStatus.textContent = 'Renaming…';
      try {
        const response = await fetch('/api/citations/labels', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ citation_ids: labelTargetIds, label }),

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);

      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      factDetails.set(id, payload.citation);
      return payload.citation;

      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);

      totalFacts = Number(payload.total ?? citations.length);
      filteredFacts = Number(payload.filtered_total ?? totalFacts);

    function documentFactRanges(doc) {
      const ranges = [];
      let fallbackStart = 0;
      for (const fact of doc.facts || []) {
        const storedSegments = Array.isArray(fact.source_segments) ? fact.source_segments : [];
        if (storedSegments.length) {
          storedSegments.forEach(segment => {
            const start = Number(segment?.[0]), end = Number(segment?.[1]);
            if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end <= start || end > doc.content.length) return;
            if (ranges.some(range => start < range.end && end > range.start)) return;
            ranges.push({ start, end, fact });
          });
          continue;
        }
        let start = Number(fact.document_start), end = Number(fact.document_end);
        if (!Number.isInteger(start) || !Number.isInteger(end) || doc.content.slice(start, end) !== fact.highlight) {
          start = doc.content.indexOf(fact.highlight, fallbackStart);
          if (start < 0) start = doc.content.indexOf(fact.highlight);
          end = start < 0 ? -1 : start + fact.highlight.length;
        }
        if (start < 0 || end <= start || ranges.some(range => start < range.end && end > range.start)) continue;
        ranges.push({ start, end, fact });
        fallbackStart = end;
      }
      return ranges.sort((a, b) => a.start - b.start || a.end - b.end);
    }

    function documentAnnotationRanges(doc) {
      return (doc.annotations || []).map(annotation => ({
        start: Number(annotation.document_start),
        end: Number(annotation.document_end),
        annotation,
      })).filter(range => Number.isInteger(range.start) && Number.isInteger(range.end)
        && range.start >= 0 && range.end > range.start && range.end <= doc.content.length)
        .sort((a, b) => a.start - b.start || a.end - b.end);
    }

    function decorateDocumentFragment(fragment, start, end, factRanges) {
      const fact = factRanges.find(range => range.start < end && range.end > start)?.fact;
      if (fact) {
        fragment.classList.add('document-fact-extract');
        fragment.dataset.factId = fact.id;
        fragment.title = fact.label || 'Extracted fact';
      }
      const annotation = (factRanges.annotationRanges || [])
        .find(range => range.start < end && range.end > start)?.annotation;
      if (annotation) {
        fragment.classList.add('document-annotation');
        fragment.dataset.annotationId = annotation.id;
        fragment.title = 'Personal annotation';
      }
    }

    function appendMappedText(parent, text, sourceStart, factRanges) {
      if (!text) return;
      const sourceEnd = sourceStart + text.length;
      const boundaries = new Set([sourceStart, sourceEnd]);
      [...factRanges, ...(factRanges.annotationRanges || [])].forEach(range => {
        if (range.start < sourceEnd && range.end > sourceStart) {
          boundaries.add(Math.max(sourceStart, range.start));
          boundaries.add(Math.min(sourceEnd, range.end));
        }
      });
      const points = [...boundaries].sort((a, b) => a - b);
      for (let index = 0; index + 1 < points.length; index += 1) {
        const start = points[index], end = points[index + 1];
        const fragment = document.createElement('span');
        fragment.className = 'document-source-fragment';
        fragment.dataset.sourceStart = start;
        fragment.dataset.sourceEnd = end;
        decorateDocumentFragment(fragment, start, end, factRanges);
        fragment.textContent = text.slice(start - sourceStart, end - sourceStart);
        parent.append(fragment);
      }
    }

    function appendMath(parent, formula, sourceStart, sourceEnd, factRanges, displayMode = false) {
      const fragment = document.createElement('span');
      fragment.className = `document-source-fragment math-source-fragment${displayMode ? ' math-display' : ''}`;
      fragment.dataset.sourceStart = sourceStart;
      fragment.dataset.sourceEnd = sourceEnd;
      fragment.dataset.sourceAtomic = 'true';
      decorateDocumentFragment(fragment, sourceStart, sourceEnd, factRanges);
      if (window.katex) {
        window.katex.render(formula, fragment, {
          displayMode,
          throwOnError: false,
          strict: 'ignore',
          trust: false,
        });
      } else {
        fragment.classList.add('katex-error');
        fragment.textContent = formula;
      }
      parent.append(fragment);
    }

    function appendInlineMarkdown(parent, text, sourceStart, factRanges) {
      const pattern = /(\\\[[^\n]*?\\\]|\$\$[^$\n]+?\$\$|\\\([^\n]*?\\\)|\$[^$\n]+?\$|`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_([^_\n]+)_|\[[^\]\n]+\]\([^\s)]+\))/g;
      let cursor = 0;
      for (const match of text.matchAll(pattern)) {
        appendMappedText(parent, text.slice(cursor, match.index), sourceStart + cursor, factRanges);
        const token = match[0];
        let element, inner, inset;
        if (token.startsWith('$$')) {
          appendMath(parent, token.slice(2, -2), sourceStart + match.index, sourceStart + match.index + token.length, factRanges, true);
          cursor = match.index + token.length;
          continue;
        } else if (token.startsWith('\\[')) {
          appendMath(parent, token.slice(2, -2), sourceStart + match.index, sourceStart + match.index + token.length, factRanges, true);
          cursor = match.index + token.length;
          continue;
        } else if (token.startsWith('\\(')) {
          appendMath(parent, token.slice(2, -2), sourceStart + match.index, sourceStart + match.index + token.length, factRanges);
          cursor = match.index + token.length;
          continue;
        } else if (token.startsWith('$')) {
          appendMath(parent, token.slice(1, -1), sourceStart + match.index, sourceStart + match.index + token.length, factRanges);
          cursor = match.index + token.length;
          continue;
        } else if (token.startsWith('`')) {
          element = document.createElement('code'); inner = token.slice(1, -1); inset = 1;
        } else if (token.startsWith('**') || token.startsWith('__')) {
          element = document.createElement('strong'); inner = token.slice(2, -2); inset = 2;
        } else if (token.startsWith('[')) {
          const parts = token.match(/^\[([^\]]+)\]\(([^\s)]+)\)$/);
          element = document.createElement('a'); inner = parts[1]; inset = 1;
          if (/^(https?:|mailto:|#)/i.test(parts[2])) element.href = parts[2];
          element.rel = 'noreferrer'; element.target = '_blank';
        } else {
          element = document.createElement('em'); inner = token.slice(1, -1); inset = 1;
        }
        element.dataset.sourceTokenStart = sourceStart + match.index;
        element.dataset.sourceTokenEnd = sourceStart + match.index + token.length;
        appendMappedText(element, inner, sourceStart + match.index + inset, factRanges);
        parent.append(element);
        cursor = match.index + token.length;
      }
      appendMappedText(parent, text.slice(cursor), sourceStart + cursor, factRanges);
    }

    function sourceLines(text) {
      const lines = [];
      let start = 0;
      while (start < text.length) {
        const match = /\r\n|\r|\n/.exec(text.slice(start));
        const contentEnd = match ? start + match.index : text.length;
        const end = match ? contentEnd + match[0].length : text.length;
        lines.push({ text: text.slice(start, contentEnd), start, contentEnd, end });
        start = end;
      }
      if (!text.length || /(?:\r\n|\r|\n)$/.test(text)) lines.push({ text: '', start: text.length, contentEnd: text.length, end: text.length });
      return lines;
    }

    const markdownTableCells = line => {
      const first = line.text.search(/\S/);
      const raw = line.text.slice(Math.max(0, first)).replace(/^\|/, '').replace(/\|$/, '');
      const base = line.start + Math.max(0, first) + (line.text.slice(Math.max(0, first)).startsWith('|') ? 1 : 0);
      let cursor = 0;
      return raw.split('|').map(value => {
        const leading = value.length - value.trimStart().length;
        const text = value.trim();
        const start = base + cursor + leading;
        cursor += value.length + 1;
        return { text, start };
      });
    };
    const markdownTableDivider = line => {
      const cells = markdownTableCells(line);
      return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell.text));
    };

    function renderMarkdownDocument(container, doc, factRanges) {
      const lines = sourceLines(doc.content);
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.text.trim()) { index += 1; continue; }
        const mathOpen = line.text.match(/^\s*(\$\$|\\\[)(.*)$/);
        if (mathOpen) {
          const close = mathOpen[1] === '$$' ? '$$' : '\\]';
          const sourceStart = line.start + line.text.indexOf(mathOpen[1]);
          const formulaLines = [];
          let scan = index;
          let remainder = mathOpen[2];
          let sourceEnd = -1;
          while (scan < lines.length) {
            const closeAt = remainder.indexOf(close);
            if (closeAt >= 0) {
              formulaLines.push(remainder.slice(0, closeAt));
              sourceEnd = lines[scan].start + lines[scan].text.indexOf(remainder) + closeAt + close.length;
              break;
            }
            formulaLines.push(remainder);
            scan += 1;
            remainder = scan < lines.length ? lines[scan].text : '';
          }
          if (sourceEnd >= 0) {
            appendMath(container, formulaLines.join('\n').trim(), sourceStart, sourceEnd, factRanges, true);
            index = scan + 1;
            continue;
          }
        }
        const fence = line.text.match(/^\s*```\s*([^\s`]*)/);
        if (fence) {
          const pre = document.createElement('pre'); const code = document.createElement('code');
          if (fence[1]) code.dataset.language = fence[1];
          index += 1;
          while (index < lines.length && !/^\s*```/.test(lines[index].text)) {
            appendMappedText(code, lines[index].text, lines[index].start, factRanges);
            if (index + 1 < lines.length && lines[index].end > lines[index].contentEnd) code.append('\n');
            index += 1;
          }
          if (index < lines.length) index += 1;
          pre.append(code); container.append(pre); continue;
        }
        const heading = line.text.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          const element = document.createElement(`h${heading[1].length}`);
          const offset = line.text.indexOf(heading[2]);
          appendInlineMarkdown(element, heading[2], line.start + offset, factRanges);
          container.append(element); index += 1; continue;
        }
        if (index + 1 < lines.length && line.text.includes('|') && markdownTableDivider(lines[index + 1])) {
          const wrapper = document.createElement('div'); wrapper.className = 'document-table-scroll';
          const table = document.createElement('table'); const thead = document.createElement('thead'); const headRow = document.createElement('tr');
          markdownTableCells(line).forEach(cell => { const th = document.createElement('th'); appendInlineMarkdown(th, cell.text, cell.start, factRanges); headRow.append(th); });
          thead.append(headRow); table.append(thead); index += 2;
          const tbody = document.createElement('tbody');
          while (index < lines.length && lines[index].text.trim() && lines[index].text.includes('|')) {
            const row = document.createElement('tr');
            markdownTableCells(lines[index]).forEach(cell => { const td = document.createElement('td'); appendInlineMarkdown(td, cell.text, cell.start, factRanges); row.append(td); });
            tbody.append(row); index += 1;
          }
          table.append(tbody); wrapper.append(table); container.append(wrapper); continue;
        }
        const listMatch = line.text.match(/^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/);
        if (listMatch) {
          const ordered = Boolean(listMatch[2]); const list = document.createElement(ordered ? 'ol' : 'ul');
          while (index < lines.length) {
            const itemMatch = lines[index].text.match(/^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/);
            if (!itemMatch || Boolean(itemMatch[2]) !== ordered) break;
            const item = document.createElement('li'); const offset = lines[index].text.indexOf(itemMatch[3]);
            appendInlineMarkdown(item, itemMatch[3], lines[index].start + offset, factRanges);
            list.append(item); index += 1;
          }
          container.append(list); continue;
        }
        if (/^\s*>/.test(line.text)) {
          const quote = document.createElement('blockquote'); let first = true;
          while (index < lines.length && /^\s*>/.test(lines[index].text)) {
            const content = lines[index].text.replace(/^\s*>\s?/, '');
            if (!first) quote.append(' '); first = false;
            appendInlineMarkdown(quote, content, lines[index].start + lines[index].text.indexOf(content), factRanges); index += 1;
          }
          container.append(quote); continue;
        }
        if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line.text)) { container.append(document.createElement('hr')); index += 1; continue; }
        const paragraph = document.createElement('p'); let first = true;
        while (index < lines.length && lines[index].text.trim()) {
          const current = lines[index];
          if (!first && (/^\s*(?:\$\$|\\\[)/.test(current.text) || /^\s*```/.test(current.text) || /^\s*#{1,6}\s/.test(current.text) || /^\s*(?:[-+*]|\d+\.)\s+/.test(current.text))) break;
          if (!first) paragraph.append(' '); first = false;
          const trimmed = current.text.trim();
          appendInlineMarkdown(paragraph, trimmed, current.start + current.text.indexOf(trimmed), factRanges); index += 1;
        }
        container.append(paragraph);
      }
    }

    function appendMappedHtmlText(parent, raw, sourceStart, factRanges) {
      const entityPattern = /&(?:#\d+|#x[\da-f]+|[a-z][\da-z]+);/ig;
      let cursor = 0;
      for (const match of raw.matchAll(entityPattern)) {
        appendMappedText(parent, raw.slice(cursor, match.index), sourceStart + cursor, factRanges);
        const decoder = document.createElement('textarea'); decoder.innerHTML = match[0];
        const fragment = document.createElement('span'); fragment.className = 'document-source-fragment';
        fragment.dataset.sourceStart = sourceStart + match.index;
        fragment.dataset.sourceEnd = sourceStart + match.index + match[0].length;
        fragment.dataset.sourceAtomic = 'true'; fragment.textContent = decoder.value;
        decorateDocumentFragment(
          fragment,
          Number(fragment.dataset.sourceStart),
          Number(fragment.dataset.sourceEnd),
          factRanges,
        );
        parent.append(fragment); cursor = match.index + match[0].length;
      }
      appendMappedText(parent, raw.slice(cursor), sourceStart + cursor, factRanges);
    }

    function renderHtmlDocument(container, doc, factRanges) {
      const allowed = new Set(['p','div','section','article','h1','h2','h3','h4','h5','h6','ul','ol','li','blockquote','pre','code','table','thead','tbody','tfoot','tr','th','td','strong','b','em','i','a','br','hr']);
      const blocked = new Set(['script','style','iframe','object','embed','form','input','button','textarea','select','svg','math']);
      const stack = [{ tag: '', element: container }]; let blockedTag = null;
      for (const token of doc.content.matchAll(/<!--[\s\S]*?-->|<![^>]*>|<[^>]*>|[^<]+/g)) {
        const raw = token[0], sourceStart = token.index;
        if (!raw.startsWith('<')) { if (!blockedTag) appendMappedHtmlText(stack.at(-1).element, raw, sourceStart, factRanges); continue; }
        const closing = raw.match(/^<\s*\/\s*([\w-]+)/); const opening = raw.match(/^<\s*([\w-]+)/);
        const tag = (closing?.[1] || opening?.[1] || '').toLowerCase();
        if (blockedTag) { if (closing && tag === blockedTag) blockedTag = null; continue; }
        if (blocked.has(tag) && !closing) { blockedTag = tag; continue; }
        if (closing) {
          const position = stack.map(item => item.tag).lastIndexOf(tag);
          if (position > 0) stack.splice(position);
          continue;
        }
        if (!opening || !allowed.has(tag)) continue;
        const normalized = tag === 'b' ? 'strong' : tag === 'i' ? 'em' : tag;
        const element = document.createElement(normalized);
        if (tag === 'a') {
          const href = raw.match(/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
          const value = href?.[1] || href?.[2] || href?.[3] || '';
          if (/^(https?:|mailto:|#)/i.test(value)) element.href = value;
          element.rel = 'noreferrer'; element.target = '_blank';
        }
        stack.at(-1).element.append(element);
        if (!['br','hr'].includes(tag) && !/\/\s*>$/.test(raw)) stack.push({ tag, element });
      }
    }

    function renderDocumentContent(container, doc) {
      container.replaceChildren();
      const factRanges = documentFactRanges(doc);
      factRanges.annotationRanges = documentAnnotationRanges(doc);
      const name = String(doc.name || '').toLowerCase();
      const format = /\.html?$/.test(name) ? 'html' : /\.(?:md|markdown)$/.test(name) ? 'markdown' : 'plain';
      container.classList.toggle('is-formatted', format !== 'plain');
      if (format === 'markdown') renderMarkdownDocument(container, doc, factRanges);
      else if (format === 'html') renderHtmlDocument(container, doc, factRanges);
      else appendMappedText(container, doc.content, 0, factRanges);
    }

    function selectedSourceRange(root, range) {
      const fragments = [...root.querySelectorAll('.document-source-fragment')].filter(fragment => range.intersectsNode(fragment));
      if (!fragments.length) return null;
      let start = Math.min(...fragments.map(fragment => Number(fragment.dataset.sourceStart)));
      let end = Math.max(...fragments.map(fragment => Number(fragment.dataset.sourceEnd)));
      const startFragment = range.startContainer.nodeType === Node.TEXT_NODE
        ? range.startContainer.parentElement?.closest('.document-source-fragment') : null;
      const endFragment = range.endContainer.nodeType === Node.TEXT_NODE
        ? range.endContainer.parentElement?.closest('.document-source-fragment') : null;
      if (startFragment && root.contains(startFragment)) {
        start = startFragment.dataset.sourceAtomic === 'true'
          ? Number(startFragment.dataset.sourceStart)
          : Number(startFragment.dataset.sourceStart) + range.startOffset;
      }
      if (endFragment && root.contains(endFragment)) {
        end = endFragment.dataset.sourceAtomic === 'true'
          ? Number(endFragment.dataset.sourceEnd)
          : Number(endFragment.dataset.sourceStart) + range.endOffset;
      }
      // When the complete visible part of an inline Markdown token is selected,
      // retain its delimiters too (for example both ** around strong text).
      root.querySelectorAll('[data-source-token-start]').forEach(token => {
        const tokenFragments = [...token.querySelectorAll('.document-source-fragment')];
        if (!tokenFragments.length) return;
        const contentStart = Math.min(...tokenFragments.map(fragment => Number(fragment.dataset.sourceStart)));
        const contentEnd = Math.max(...tokenFragments.map(fragment => Number(fragment.dataset.sourceEnd)));
        if (start <= contentStart && end >= contentEnd) {
          start = Math.min(start, Number(token.dataset.sourceTokenStart));
          end = Math.max(end, Number(token.dataset.sourceTokenEnd));
        }
      });
      return { start, end };
    }

    function integrableSourceSegments(root, range, source) {
      const allFragments = [...root.querySelectorAll('.document-source-fragment')]
        .filter(fragment => range.intersectsNode(fragment));
      const isExcluded = fragment => fragment.classList.contains('math-source-fragment') || Boolean(fragment.closest('pre'));
      const excluded = allFragments.filter(isExcluded).map(fragment => ({
        start: Number(fragment.dataset.sourceStart),
        end: Number(fragment.dataset.sourceEnd),
      }));
      const boundaryOffset = (fragment, container, offset, fallback) => {
        if (!fragment.contains(container) || fragment.dataset.sourceAtomic === 'true') return fallback;
        const probe = document.createRange();
        probe.selectNodeContents(fragment);
        try { probe.setEnd(container, offset); }
        catch { return fallback; }
        return Number(fragment.dataset.sourceStart) + probe.toString().length;
      };
      const pieces = allFragments.filter(fragment => !isExcluded(fragment)).map(fragment => {
        let start = Number(fragment.dataset.sourceStart), end = Number(fragment.dataset.sourceEnd);
        start = boundaryOffset(fragment, range.startContainer, range.startOffset, start);
        end = boundaryOffset(fragment, range.endContainer, range.endOffset, end);
        return { start, end };
      }).filter(piece => Number.isInteger(piece.start) && Number.isInteger(piece.end) && piece.end > piece.start)
        .sort((a, b) => a.start - b.start || a.end - b.end);
      const merged = [];
      pieces.forEach(piece => {
        const previous = merged.at(-1);
        const excludedBetween = previous && excluded.some(item => item.start < piece.start && item.end > previous.end);
        if (previous && !excludedBetween) previous.end = Math.max(previous.end, piece.end);
        else merged.push({ ...piece });
      });
      return merged.map(piece => {
        while (piece.start < piece.end && /\s/.test(source[piece.start])) piece.start += 1;
        while (piece.end > piece.start && /\s/.test(source[piece.end - 1])) piece.end -= 1;
        return piece;
      }).filter(piece => piece.end > piece.start);
    }

    const sourceSegmentsText = (source, segments) => segments
      .map(segment => source.slice(segment.start, segment.end).trim())
      .filter(Boolean)
      .join('\n\n')
      .trim();

    function updateDocumentSelection() {
      documentSelection = null;
      const bar = entityContent.querySelector('.document-selection-bar');
      if (!bar || !selectedDocument) return;
      const preview = entityContent.querySelector('.document-preview');
      const selection = window.getSelection();
      if (!preview || !selection || !selection.rangeCount || selection.isCollapsed) { bar.hidden = true; return; }
      const range = selection.getRangeAt(0);
      if (!preview.contains(range.commonAncestorContainer)) { bar.hidden = true; return; }
      const sourceRange = selectedSourceRange(preview, range);
      if (!sourceRange) { bar.hidden = true; return; }
      const low = Math.min(sourceRange.start, sourceRange.end), high = Math.max(sourceRange.start, sourceRange.end);
      const highlight = selectedDocument.content.slice(low, high);
      if (!highlight.trim()) { bar.hidden = true; return; }
      const sourceSegments = integrableSourceSegments(preview, range, selectedDocument.content);
      const integrationHighlight = sourceSegmentsText(selectedDocument.content, sourceSegments);
      const lineStart = selectedDocument.content.lastIndexOf('\n', low - 1) + 1;
      const nextBreak = selectedDocument.content.indexOf('\n', high);
      const lineEnd = nextBreak < 0 ? selectedDocument.content.length : nextBreak;
      documentSelection = {
        highlight,
        context: selectedDocument.content.slice(lineStart, lineEnd).trim(),
        document_start: low,
        document_end: high,
        integration_highlight: integrationHighlight,
        source_segments: sourceSegments.map(segment => [segment.start, segment.end]),
      };
      const extract = bar.querySelector('.document-extract-button');
      if (extract) extract.hidden = !integrationHighlight;
      bar.hidden = false;
    }

    const activeAnnotations = () => selectedDocument?.annotations || selectedChat?.messages
      ?.flatMap(message => (message.annotations || []).map(annotation => ({
        ...annotation,
        chat_message_id: message.id,
        document_start: Number(annotation.message_start),
        document_end: Number(annotation.message_end),
      }))) || [];
    const documentAnnotationById = annotationId => activeAnnotations()
      .find(annotation => Number(annotation.id) === Number(annotationId)) || null;

    function hideAnnotationPeek() {
      const changed = hoveredAnnotationId !== null;
      hoveredAnnotationId = null;
      annotationPeek.hidden = true;
      annotationPeek.textContent = '';
      if (changed) scheduleDocumentLinks();
    }

    function showAnnotationPeek(annotationId) {
      const id = Number(annotationId);
      if (annotationDialog.open || hoveredAnnotationId === id) return;
      const annotation = documentAnnotationById(id);
      if (!annotation) { hideAnnotationPeek(); return; }
      hoveredAnnotationId = id;
      annotationPeek.textContent = annotation.note;
      annotationPeek.hidden = false;
      scheduleDocumentLinks();
    }

    function closeAnnotationDialog() {
      if (annotationDialog.open) annotationDialog.close();
      editingAnnotationId = null;
      annotationSelection = null;
      annotationSourceKind = null;
      annotationText.value = '';
      annotationStatus.textContent = '';
    }

    function openAnnotationDialog(annotation = null, selection = null) {
      if (!selectedDocument && !selectedChat) return;
      hideAnnotationPeek();
      editingAnnotationId = annotation ? Number(annotation.id) : null;
      annotationSelection = selection ? { ...selection } : null;
      annotationSourceKind = annotation?.chat_message_id || selection?.chat_message_id ? 'chat' : 'document';
      const start = annotation ? Number(annotation.document_start) : Number(selection?.document_start);
      const end = annotation ? Number(annotation.document_end) : Number(selection?.document_end);
      document.querySelector('#annotation-title').textContent = annotation ? 'Edit annotation' : 'Add annotation';
      document.querySelector('#annotation-copy').textContent = annotation
        ? 'Update your personal note for this passage.'
        : 'This note belongs only to the selected document passage.';
      const messageId = annotation?.chat_message_id || selection?.chat_message_id;
      const sourceContent = annotationSourceKind === 'chat'
        ? selectedChat?.messages?.find(message => message.id === messageId)?.content || ''
        : selectedDocument?.content || '';
      annotationSource.textContent = Number.isInteger(start) && Number.isInteger(end)
        ? sourceContent.slice(start, end).trim()
        : '';
      annotationText.value = annotation?.note || '';
      annotationStatus.textContent = '';
      annotationDialog.showModal();
      requestAnimationFrame(() => annotationText.focus());
    }

    async function saveAnnotation(event) {
      event.preventDefault();
      if (!selectedDocument && !selectedChat) return;
      const note = annotationText.value.trim();
      if (!note) { annotationText.focus(); return; }
      const documentId = Number(selectedDocument?.id);
      const sourceKind = annotationSourceKind;
      const controls = [...annotationForm.elements];
      controls.forEach(control => { control.disabled = true; });
      annotationStatus.textContent = 'Saving…';
      try {
        const editing = editingAnnotationId !== null;
        const chatMessageId = annotationSelection?.chat_message_id
          || documentAnnotationById(editingAnnotationId)?.chat_message_id;
        const path = sourceKind === 'chat'
          ? (editing ? `/api/chat-annotations/${editingAnnotationId}` : `/api/chat-messages/${chatMessageId}/annotations`)
          : (editing ? `/api/annotations/${editingAnnotationId}` : `/api/documents/${documentId}/annotations`);
        const body = editing ? { note } : sourceKind === 'chat'
          ? {
              note,
              message_start: annotationSelection?.document_start,
              message_end: annotationSelection?.document_end,
            }
          : {
              note,
              document_start: annotationSelection?.document_start,
              document_end: annotationSelection?.document_end,
            };
        const response = await fetch(path, {
          method: editing ? 'PATCH' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        closeAnnotationDialog();
        documentSelection = null;
        chatSelection = null;
        window.getSelection()?.removeAllRanges();
        if (activeEntity === 'chats' && selectedChatId) await openChat(selectedChatId, true);
        else if (sourceKind === 'chat') await openChat(selectedChatId, true);
        else await openDocument(documentId, true);
      } catch (error) {
        annotationStatus.textContent = error.message;
      } finally {
        controls.forEach(control => { control.disabled = false; });
      }
    }

    function renderDocumentDetail(doc) {
      startPerformanceProbe('document-open', {
        document_id: Number(doc.id),
        name: doc.name,
        recovered: Boolean(doc.recovered),
        variant: document.documentElement.dataset.perfVariant || 'baseline',
      });
      performanceMarker('document-render-start');
      hideAnnotationPeek();
      const sourceKey = `document:${Number(doc.id)}`;
      const shouldFitGraph = !documentGraphFocus || documentGraphFocus.sourceKey !== sourceKey;
      const focusGeneration = ++documentFocusGeneration;
      clearDocumentFactHover();
      entityContent.replaceChildren();
      const detail = document.createElement('section'); detail.className = 'document-detail';
      const head = document.createElement('div'); head.className = 'document-detail-head';
      const back = document.createElement('button'); back.type = 'button'; back.className = 'fact-back'; back.textContent = '← All documents';
      back.addEventListener('click', () => {
        clearDocumentFactHover();
        clearDocumentGraphFocus();
        selectedDocumentId = null; selectedDocument = null; documentSelection = null;
        renderDocumentsList();
      });
      const title = document.createElement('span'); title.className = 'document-detail-title'; title.textContent = doc.name;
      head.append(back, title);
      const preview = document.createElement('article'); preview.className = 'document-preview';
      renderDocumentContent(preview, doc);
      performanceMarker('document-content-built');
      preview.addEventListener('pointermove', event => {
        const factId = documentFactAtPoint(preview, event.clientX, event.clientY);
        if (factId === null) clearDocumentFactHover();
        else hoverDocumentFact(factId);
        const annotationId = documentAnnotationAtPoint(preview, event.clientX, event.clientY);
        if (annotationId !== null) showAnnotationPeek(annotationId);
        else hideAnnotationPeek();
      });
      preview.addEventListener('pointerleave', () => { clearDocumentFactHover(); hideAnnotationPeek(); });
      preview.addEventListener('scroll', () => { hideAnnotationPeek(); scheduleDocumentLinks(); }, { passive: true });
      preview.addEventListener('click', event => {
        const annotationId = documentAnnotationAtPoint(preview, event.clientX, event.clientY);
        if (annotationId === null) return;
        const annotation = documentAnnotationById(annotationId);
        if (annotation) openAnnotationDialog(annotation);
      });
      preview.addEventListener('pointerup', () => requestAnimationFrame(updateDocumentSelection));
      preview.addEventListener('keyup', () => requestAnimationFrame(updateDocumentSelection));
      const status = document.createElement('div'); status.className = 'document-status';
      status.textContent = doc.recovered
        ? 'Only recovered excerpts are available. Select text to annotate or extract a fact.'
        : 'Select text to annotate or extract a read-only fact.';
      const selectionBar = document.createElement('div'); selectionBar.className = 'document-selection-bar'; selectionBar.hidden = true;
      const actions = document.createElement('div'); actions.className = 'document-selection-actions';
      const annotate = document.createElement('button'); annotate.type = 'button'; annotate.className = 'document-annotate-button'; annotate.textContent = 'Annotate';
      annotate.addEventListener('mousedown', event => event.preventDefault());
      annotate.addEventListener('click', () => {
        if (documentSelection) openAnnotationDialog(null, documentSelection);
      });
      const extract = document.createElement('button'); extract.type = 'button'; extract.className = 'document-extract-button'; extract.textContent = 'Extract fact';
      extract.addEventListener('mousedown', event => event.preventDefault());
      extract.addEventListener('click', () => extractDocumentFact(status, selectionBar));
      actions.append(annotate, extract); selectionBar.append(actions);
      detail.append(head, preview, status, selectionBar); entityContent.append(detail);
      performanceMarker('document-attached');
      scheduleDocumentLinks();
      // WebKitGTK noticeably drops graph-animation frames when document layout,
      // highlight measurement and the camera transition begin together. Let the
      // new preview paint and its highlight overlay settle before moving the graph.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (focusGeneration !== documentFocusGeneration
            || selectedDocumentId !== Number(doc.id)
            || activeEntity !== 'docs') return;
        performanceMarker('document-layout-settled');
        applyDocumentGraphFocus(doc, { fit: shouldFitGraph, sourceKey });
      }));
    }

    async function loadDocuments() {
      const parameters = new URLSearchParams();
      if (documentQuery) parameters.set('q', documentQuery);
      if (documentConcept) parameters.set('concept', documentConcept);
      const response = await fetch(`/api/documents${parameters.size ? `?${parameters}` : ''}`);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      documents = payload.documents || [];
      documentConcepts = payload.concepts || [];
      totalDocuments = Number(payload.total ?? documents.length);
      filteredDocuments = Number(payload.filtered_total ?? documents.length);
      const count = document.querySelector('.entity-box[data-entity="docs"] [data-entity-count]');
      if (count) count.textContent = totalDocuments;
      if (activeEntity === 'docs' && selectedDocumentId === null) renderDocumentsList();
    }

    async function openDocument(documentId, force = false) {
      const id = Number(documentId);
      if (!force && selectedDocument?.id === id) { renderDocumentDetail(selectedDocument); return; }
      const response = await fetch(`/api/documents/${id}`);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      selectedDocumentId = id;
      selectedDocument = payload.document;
      documentSelection = null;
      renderDocumentDetail(selectedDocument);
    }

    async function openDocumentFact(fact) {
      closeQueue();
      activeEntity = 'docs';
      selectedFactId = null;
      factEditorOrigin = null;
      entityAction.textContent = 'Load document';
      entityAction.style.background = '#f1bd74';
      entityPanel.hidden = false;

        'aria-expanded', button.dataset.entity === 'docs' ? 'true' : 'false'
      ));

        await openDocument(Number(fact.document_id));

        const marks = [...entityContent.querySelectorAll(`.document-fact-extract[data-fact-id="${Number(fact.id)}"]`)];
        if (!marks.length) return;

    async function openChatFact(fact) {

      activeEntity = 'chats';
      selectedFactId = null;
      factEditorOrigin = null;
      entityAction.textContent = 'New chat';

      } catch (error) {

      requestAnimationFrame(() => {
        const marks = [...entityContent.querySelectorAll(`.document-fact-extract[data-fact-id="${Number(fact.id)}"]`)];
        if (!marks.length) return;
        marks.forEach(mark => mark.classList.add('is-source-focus'));
        marks[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
        selectFactInCurrentView(fact.id);
        scheduleDocumentLinks();
      });

    async function extractDocumentFact(status, selectionBar) {

    function updateChatSelection() {
      chatSelection = null;
      const bar = entityContent.querySelector('.document-selection-bar');
      const transcript = entityContent.querySelector('.chat-transcript');
      const selection = window.getSelection();
      if (!bar || !selectedChat || !transcript || !selection || !selection.rangeCount || selection.isCollapsed) {
        if (bar) bar.hidden = true;
        return;
      }
      const range = selection.getRangeAt(0);
      const startElement = range.startContainer.nodeType === Node.TEXT_NODE ? range.startContainer.parentElement : range.startContainer;
      const endElement = range.endContainer.nodeType === Node.TEXT_NODE ? range.endContainer.parentElement : range.endContainer;
      const startRoot = startElement?.closest?.('.chat-message-content');
      const endRoot = endElement?.closest?.('.chat-message-content');
      if (!startRoot || startRoot !== endRoot || !transcript.contains(startRoot)) { bar.hidden = true; return; }
      const sourceRange = selectedSourceRange(startRoot, range);
      if (!sourceRange) { bar.hidden = true; return; }
      const messageId = startRoot.dataset.messageId;
      const message = selectedChat.messages.find(candidate => candidate.id === messageId);
      if (!message) { bar.hidden = true; return; }
      const low = Math.min(sourceRange.start, sourceRange.end), high = Math.max(sourceRange.start, sourceRange.end);
      const highlight = message.content.slice(low, high);
      if (!highlight.trim()) { bar.hidden = true; return; }
      const sourceSegments = integrableSourceSegments(startRoot, range, message.content);
      const integrationHighlight = sourceSegmentsText(message.content, sourceSegments);
      const lineStart = message.content.lastIndexOf('\n', low - 1) + 1;
      const nextBreak = message.content.indexOf('\n', high);
      const lineEnd = nextBreak < 0 ? message.content.length : nextBreak;
      chatSelection = {
        highlight,
        context: message.content.slice(lineStart, lineEnd).trim(),
        chat_message_id: message.id,
        document_start: low,
        document_end: high,
        integration_highlight: integrationHighlight,
        source_segments: sourceSegments.map(segment => [segment.start, segment.end]),
      };
      const extract = bar.querySelector('.document-extract-button');
      if (extract) extract.hidden = !integrationHighlight;
      bar.hidden = false;
    }

    function setIntegrationJobs(text, discoverLabel = true) {
      const detail = text.length > 54 ? `${text.slice(0, 51)}…` : text;
      modelQueues.t5gemma.jobs = discoverLabel
        ? [{ stage: 't5gemma', title: 'Generate concept label', detail, state: 'queued' }]
        : [];
      modelQueues.qwen.jobs = discoverLabel
        ? [{ stage: 'qwen', title: 'Generate concept label', detail, state: 'queued' }]
        : [];
      modelQueues.bge.jobs = [{
        stage: 'bge',
        title: discoverLabel ? 'Rank labels and embed passage' : 'Refresh passage embedding',
        detail,
        state: 'queued',
      }];
      refreshQueueCounts();
    }

    function clearIntegrationJobs() {
      Object.values(modelQueues).forEach(queue => { queue.jobs = []; });
      refreshQueueCounts();
    }

    function updateIntegrationJobs(stages) {
      for (const [stage, state] of Object.entries(stages || {})) {
        const model = stage.startsWith('t5gemma_caption_')
          ? 't5gemma'
          : (stage.startsWith('qwen_caption_') ? 'qwen' : stage);
        const queue = modelQueues[model];
        if (!queue) continue;
        let job = queue.jobs.find(item => item.stage === stage);
        if (!job && (stage.startsWith('t5gemma_caption_') || stage.startsWith('qwen_caption_'))) {
          const factId = stage.slice(stage.indexOf('_caption_') + '_caption_'.length);
          job = { stage, title: 'Generate fact caption', detail: `Stored fact #${factId}`, state };
          queue.jobs.push(job);
        }
        if (job) job.state = state;
      }
      refreshQueueCounts();
    }

    function failIntegration(message) {
      Object.values(modelQueues).forEach(queue => {
        if (queue.jobs[0]) {
          queue.jobs[0].state = 'failed';
          queue.jobs[0].detail = message;
        }
      });
      refreshQueueCounts();
    }

    async function pollIntegration(jobId, onComplete = null, onError = null) {
      try {
        const response = await fetch(`/api/integrations/${encodeURIComponent(jobId)}`);
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
        updateIntegrationJobs(job.stages);
        if (job.state === 'complete') {
          await applyIntegrationResult(job.result);
          await loadFacts();
          await loadHistoryStatus();
          if (onComplete) await onComplete(job.result);
          return;
        }
        if (job.state === 'failed') {
          failIntegration(job.error || 'Local integration failed');
          if (onError) onError(job.error || 'Local integration failed');
          return;
        }
        setTimeout(() => pollIntegration(jobId, onComplete, onError), 400);
      } catch (error) {
        failIntegration(error.message);
        if (onError) onError(error.message);
      }
    }

    async function startIntegration(text) {
      try {
        const response = await fetch('/api/integrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'simple fact', highlight: text, context: '' }),
        });
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
        pollIntegration(job.id);
      } catch (error) {
        failIntegration(error.message);
      }
    }
